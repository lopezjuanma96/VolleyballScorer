<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Fixture, resultados y posiciones del torneo de vóley, en vivo." />
    <title>Partidos · Torneo de vóley</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js"></script>
</head>
<body>
    <header class="bar"></header>
    <main class="page">
        <div class="spread"><h1 class="title">Partidos</h1></div>
        <nav id="category-tabs" class="tabs" aria-label="Filtrar por categoría" style="margin-top:12px"></nav>
        <div id="match-list" aria-busy="true"><p class="empty">Cargando partidos…</p></div>
    </main>
    <script>
        let allMatches = [], allCategories = [], activeCategory = Number(new URLSearchParams(location.search).get('c')) || null
        const esc = App.escape
        function render() {
            const filtered = (activeCategory ? allMatches.filter(m => m.categoryId === activeCategory) : allMatches).sort((a, b) => new Date(a.scheduledAt) - new Date(b.scheduledAt))
            const live = filtered.filter(m => m.status === 'in_progress')
            const days = new Map()
            for (const m of filtered.filter(m => m.status !== 'in_progress')) {
                const key = App.dayKey(m.scheduledAt)
                if (!days.has(key)) days.set(key, [])
                days.get(key).push(m)
            }
            const groups = [...(live.length ? [['En juego', live]] : []), ...[...days.values()].map(rows => [App.day(rows[0].scheduledAt), rows])]
            document.getElementById('match-list').innerHTML = groups.map(([label, rows]) => `<section><h2 class="day">${esc(label)}</h2>${rows.map(m => App.matchRow(m)).join('')}</section>`).join('')
                || '<p class="empty">Todavía no hay partidos publicados.</p>'
            document.getElementById('match-list').setAttribute('aria-busy', 'false')
            document.getElementById('category-tabs').innerHTML = allCategories.length > 1 ? [{ id: null, name: 'Todas' }, ...allCategories].map(c => `<button class="tab" onclick="selectCategory(${c.id})" aria-pressed="${c.id === activeCategory}">${esc(c.name)}</button>`).join('') : ''
        }
        function selectCategory(id) {
            activeCategory = id
            history.replaceState(null, '', id ? `?c=${id}` : location.pathname)
            render()
        }
        async function load() {
            const [matches, categories] = await Promise.all([App.json('/api/matches'), App.json('/api/categories')])
            allMatches = matches; allCategories = categories
            if (activeCategory && !categories.some(c => c.id === activeCategory)) activeCategory = null
            render()
        }
        App.ready.then(load).catch(() => {
            document.getElementById('match-list').innerHTML = '<p class="empty">No pudimos cargar el fixture. <button class="btn-link" onclick="location.reload()">Reintentar</button></p>'
        }).finally(() => App.watch(load))
    </script>
</body>
</html>
