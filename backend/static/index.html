<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Fixture, resultados y posiciones del torneo de vóley, en vivo." />
    <title>Partidos · Torneo de vóley</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js"></script>
</head>
<body>
    <header class="bar"></header>
    <main class="page">
        <div class="spread"><h1 class="title">Partidos</h1></div>
        <nav id="category-tabs" class="tabs" aria-label="Filtrar por categoría" style="margin-top:12px"></nav>
        <div id="match-list" aria-busy="true"><p class="empty">Cargando partidos…</p></div>
    </main>
    <script>
        let allMatches = [], allCategories = [], activeCategory = Number(new URLSearchParams(location.search).get('c')) || null
        const esc = App.escape
        function teamLine(m, side, score, won) {
            const team = side === 'home' ? m.teamHome : m.teamAway
            const sets = m.sets.filter(s => s.status === 'finished_home' || s.status === 'finished_away').map(s => side === 'home' ? s.scoreHome : s.scoreAway).join(' ')
            return `<div class="match-team ${won ? 'won' : ''}"><span class="name">${esc(team.name)}</span><span class="sets">${sets}</span><span class="score">${score}</span></div>`
        }
        function card(m) {
            const winner = App.winner(m)
            const live = m.status === 'in_progress', upcoming = m.status === 'upcoming'
            const active = live && m.sets.find(s => s.status === 'in_progress')
            const score = side => upcoming || m.status === 'cancelled' ? '' : active ? (side === 'home' ? active.scoreHome : active.scoreAway) : App.setsWon(m, side)
            const status = live ? `<span class="badge badge-live"><span class="live-dot"></span>${active ? `Set ${active.setNumber}` : 'En juego'}</span>` : upcoming ? '' : `<span class="badge">${App.statusLabel(m.status)}</span>`
            const label = `${m.teamHome.name} contra ${m.teamAway.name}${winner ? `. Ganó ${winner.name}` : live ? '. En juego' : ''}`
            return `<a class="match-row ${live ? 'is-live' : ''}" href="/game.html?id=${m.id}" aria-label="${esc(label)}">
                <span class="match-time">${App.time(m.scheduledAt)}</span>
                <span class="match-teams">${teamLine(m, 'home', score('home'), winner === m.teamHome)}${teamLine(m, 'away', score('away'), winner === m.teamAway)}</span>
                <span class="match-meta"><span>${esc(m.categoryName)} · ${App.court(m.court)}</span><br>${status}</span>
            </a>`
        }
        function render() {
            const filtered = (activeCategory ? allMatches.filter(m => m.categoryId === activeCategory) : allMatches).sort((a, b) => new Date(a.scheduledAt) - new Date(b.scheduledAt))
            const live = filtered.filter(m => m.status === 'in_progress')
            const days = new Map()
            for (const m of filtered.filter(m => m.status !== 'in_progress')) {
                const key = App.dayKey(m.scheduledAt)
                if (!days.has(key)) days.set(key, [])
                days.get(key).push(m)
            }
            const groups = [...(live.length ? [['En juego', live]] : []), ...[...days.values()].map(rows => [App.day(rows[0].scheduledAt), rows])]
            document.getElementById('match-list').innerHTML = groups.map(([label, rows]) => `<section><h2 class="day">${esc(label)}</h2>${rows.map(card).join('')}</section>`).join('')
                || '<p class="empty">Todavía no hay partidos publicados.</p>'
            document.getElementById('match-list').setAttribute('aria-busy', 'false')
            document.getElementById('category-tabs').innerHTML = allCategories.length > 1 ? [{ id: null, name: 'Todas' }, ...allCategories].map(c => `<button class="tab" onclick="selectCategory(${c.id})" aria-pressed="${c.id === activeCategory}">${esc(c.name)}</button>`).join('') : ''
        }
        function selectCategory(id) {
            activeCategory = id
            history.replaceState(null, '', id ? `?c=${id}` : location.pathname)
            render()
        }
        async function load() {
            const [matches, categories] = await Promise.all([App.json('/api/matches'), App.json('/api/categories')])
            allMatches = matches; allCategories = categories
            if (activeCategory && !categories.some(c => c.id === activeCategory)) activeCategory = null
            render()
        }
        App.ready.then(load).catch(() => {
            document.getElementById('match-list').innerHTML = '<p class="empty">No pudimos cargar el fixture. <button class="btn-link" onclick="location.reload()">Reintentar</button></p>'
        }).finally(() => App.watch(load))
    </script>
</body>
</html>
