<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Partido · Panel</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js"></script>
</head>
<body>
    <header class="bar"></header>
    <main class="page page-narrow">
        <h1 class="title" id="form-title">Nuevo partido</h1>
        <form id="match-form" class="stack" style="margin-top:16px" novalidate>
            <div class="form-grid">
                <div class="field"><label for="category">Categoría</label><select id="category" required><option value="">Elegí una categoría…</option></select></div>
                <div class="field"><label for="court">Cancha</label><select id="court"></select></div>
            </div>
            <div class="form-grid">
                <div class="field"><label for="team-home">Equipo local</label><select id="team-home" required><option value="">Elegí una categoría primero</option></select></div>
                <div class="field"><label for="team-away">Equipo visitante</label><select id="team-away" required><option value="">Elegí una categoría primero</option></select></div>
            </div>
            <div class="field"><label for="label">Descripción <span class="muted">(opcional)</span></label><input type="text" id="label" maxlength="100" placeholder="Ej: Fecha 3, Semifinal 1" /></div>
            <div class="field">
                <label for="scheduled-at">Fecha y hora</label>
                <input type="datetime-local" id="scheduled-at" required />
                <span id="timezone-info" class="hint" role="note"></span>
                <span id="tournament-preview" class="small" aria-live="polite"></span>
            </div>

            <section class="stack-sm">
                <h2 class="section" style="margin:12px 0 4px">Reglas</h2>
                <p id="category-rules" class="small muted">Elegí una categoría para ver sus reglas.</p>
                <label class="check"><input type="checkbox" id="custom-rules" /> Usar reglas propias para este partido</label>
                <div id="rules-fields" class="panel hidden">
                    <div id="rules"></div>
                    <p id="rules-edit-note" class="tiny muted hidden" style="margin-top:10px">Cambiar las reglas con el partido en juego no reevalúa los sets ya cerrados.</p>
                </div>
            </section>

            <p id="form-error" class="error hidden" role="alert"></p>
            <div class="row">
                <button type="submit" class="btn btn-primary" id="save-button">Crear partido</button>
                <a class="btn" href="/manager/">Cancelar</a>
            </div>
        </form>
    </main>
    <script>
        let allTeams = [], allCategories = [], editingMatch = null
        const editingId = Number(new URLSearchParams(location.search).get('id')) || null
        const $ = id => document.getElementById(id)
        const currentCategory = () => allCategories.find(c => c.id === Number($('category').value))
        const rules = App.ruleForm($('rules'))
        let rulesFilled = false
        const fillRules = r => { rules.fill(r); rulesFilled = true }
        function showError(message) { $('form-error').textContent = message; $('form-error').classList.toggle('hidden', !message) }

        function updateTimezonePreview() {
            const deviceZone = Intl.DateTimeFormat().resolvedOptions().timeZone
            $('timezone-info').textContent = `Ingresá la hora de tu dispositivo (${deviceZone}). Zona del torneo: ${App.config.timeZone}.${!App.sameTimeZone(deviceZone, App.config.timeZone) ? ' Son zonas distintas: revisá la equivalencia antes de guardar.' : ''}`
            const value = $('scheduled-at').value
            const date = new Date(value)
            $('tournament-preview').textContent = value && !Number.isNaN(date.valueOf()) ? `En el torneo: ${new Intl.DateTimeFormat('es-AR', { timeZone: App.config.timeZone, dateStyle: 'medium', timeStyle: 'short' }).format(date)}` : ''
        }

        function updateCategory() {
            const category = currentCategory()
            $('category-rules').textContent = category ? `Reglas de la categoría: ${App.rulesText(category)}.` : 'Elegí una categoría para ver sus reglas.'
            const options = category ? allTeams.filter(t => t.categoryId === category.id) : []
            const html = options.length ? '<option value="">Elegí un equipo…</option>' + options.map(t => `<option value="${t.id}">${App.escape(t.name)}</option>`).join('') : `<option value="">${category ? 'Sin equipos en esta categoría' : 'Elegí una categoría primero'}</option>`
            $('team-home').innerHTML = html
            $('team-away').innerHTML = html
            if (category && !$('custom-rules').checked) fillRules(category)
        }

        $('custom-rules').addEventListener('change', () => {
            $('rules-fields').classList.toggle('hidden', !$('custom-rules').checked)
            const category = currentCategory()
            if ($('custom-rules').checked && category && !rulesFilled) fillRules(category)
        })
        $('category').addEventListener('change', updateCategory)
        $('scheduled-at').addEventListener('input', updateTimezonePreview)

        function localInputValue(iso) {
            const d = new Date(iso), p = n => String(n).padStart(2, '0')
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`
        }

        async function load() {
            if (!App.isAdmin()) {
                document.querySelector('main').innerHTML = '<p class="empty">Solo la organización puede crear o editar partidos. <a href="/manager/">Volver a Partidos</a></p>'
                return
            }
            $('court').innerHTML = App.courtOptions(1)
            ;[allCategories, allTeams] = await Promise.all([App.json('/api/categories'), App.json('/api/teams')])
            $('category').innerHTML = '<option value="">Elegí una categoría…</option>' + allCategories.map(c => `<option value="${c.id}">${App.escape(c.name)}</option>`).join('')
            if (editingId) {
                editingMatch = await App.json(`/api/matches/${editingId}`)
                document.title = 'Editar partido · Panel'
                $('form-title').textContent = 'Editar partido'
                $('save-button').textContent = 'Guardar cambios'
                $('form-title').insertAdjacentHTML('afterend', '<p class="small muted" data-tip="match-edit" style="margin-top:4px">Editás horario, cancha y reglas. La categoría y los equipos no se pueden cambiar.</p>')
                $('rules-edit-note').classList.remove('hidden')
                $('category').value = editingMatch.categoryId
                updateCategory()
                // Knockout sides may still wait for an earlier result: show who they wait for.
                for (const [id, team] of [['team-home', editingMatch.teamHome], ['team-away', editingMatch.teamAway]]) {
                    if (team.pending) $(id).innerHTML = `<option value="">${App.escape(team.name)}</option>`
                    else $(id).value = team.id
                }
                for (const id of ['category', 'team-home', 'team-away']) $(id).disabled = true
                if (editingMatch.phase) $('form-title').insertAdjacentHTML('afterend', `<p class="small muted" style="margin-top:4px">Partido de la fase eliminatoria «${App.escape(editingMatch.phase.name)}». Los equipos salen de la llave.</p>`)
                $('court').innerHTML = App.courtOptions(editingMatch.court)
                $('label').value = editingMatch.label ?? ''
                $('scheduled-at').value = localInputValue(editingMatch.scheduledAt)
                fillRules(editingMatch.rules)
                const custom = !App.sameRules(editingMatch.rules, currentCategory())
                $('custom-rules').checked = custom
                $('rules-fields').classList.toggle('hidden', !custom)
            }
            updateTimezonePreview()
        }

        $('match-form').addEventListener('submit', async event => {
            event.preventDefault()
            const categoryId = Number($('category').value), teamHomeId = Number($('team-home').value), teamAwayId = Number($('team-away').value)
            const court = $('court').value, scheduledAt = $('scheduled-at').value
            // On edit the category and teams are fixed (a knockout side may still be unknown).
            if (!court || !scheduledAt || (!editingId && (!categoryId || !teamHomeId || !teamAwayId))) return showError('Completá todos los campos.')
            if (!editingId && teamHomeId === teamAwayId) return showError('El equipo local y el visitante deben ser distintos.')
            const body = { court: Number(court), scheduledAt: new Date(scheduledAt).toISOString(), label: $('label').value.trim() || null }
            if (!editingId) Object.assign(body, { teamHomeId, teamAwayId, categoryId })
            if ($('custom-rules').checked) body.rules = rules.read()
            // Unchecking on edit goes back to the category's rules.
            else if (editingId && !App.sameRules(editingMatch.rules, currentCategory())) body.rules = App.RULE_KEYS.reduce((r, k) => ({ ...r, [k]: currentCategory()[k] ?? null }), {})
            showError('')
            const button = $('save-button')
            button.disabled = true
            try {
                const res = await App.send(editingId ? `/api/matches/${editingId}` : '/api/matches', editingId ? 'PUT' : 'POST', body)
                if (res.ok) return location.assign('/manager/')
                showError((await res.json().catch(() => ({}))).error ?? 'No se pudo guardar el partido.')
            } finally { button.disabled = false }
        })

        App.ready.then(load).catch(() => showError('No pudimos cargar los datos. Recargá la página.'))
    </script>
</body>
</html>
