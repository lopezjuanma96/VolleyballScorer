<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manager — Crear Partido</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <header class="bg-surface text-brand px-4 py-4 shadow flex items-center gap-3">
        <a href="/manager/" class="text-brand hover:text-brand-dark text-lg leading-none">←</a>
        <h1 id="form-title" class="text-lg font-bold tracking-wide">Nuevo partido</h1>
    </header>

    <main class="px-4 py-4 max-w-2xl mx-auto">
        <div class="bg-white rounded-xl shadow p-4 space-y-4">

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
                <select id="category"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <option value="">Seleccionar categoría...</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Equipo local</label>
                <select id="team-home"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <option value="">Seleccionar categoría primero...</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Equipo visitante</label>
                <select id="team-away"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <option value="">Seleccionar categoría primero...</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Cancha</label>
                <select id="court"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <option value="court1">Cancha 1</option>
                    <option value="court2">Cancha 2</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Fecha y hora</label>
                <input type="datetime-local" id="scheduled-at"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
            </div>

            <p id="timezone-info" class="text-sm text-gray-600" role="note"></p>
            <p id="tournament-preview" class="text-sm font-medium text-gray-700" aria-live="polite"></p>
            <p id="edit-note" class="text-sm text-gray-500 hidden">Editás horario y cancha. Los equipos y la categoría se conservan.</p>
            <p id="form-error" class="text-red-500 text-sm hidden"></p>

            <button id="save-button" onclick="submitForm()"
                class="w-full bg-surface text-brand text-sm font-semibold px-4 py-2 rounded-lg hover:bg-surface-light transition-colors">
                Crear partido
            </button>
        </div>
    </main>

    <script>
        let allTeams = []
        const editingId = new URLSearchParams(location.search).get('id')
        function updateTimezonePreview() {
            const deviceZone = Intl.DateTimeFormat().resolvedOptions().timeZone
            document.getElementById('timezone-info').textContent = `Ingresá la hora de tu dispositivo (${deviceZone}). Zona del torneo: ${App.config.timeZone}.${!App.sameTimeZone(deviceZone, App.config.timeZone) ? ' Son zonas distintas: revisá la equivalencia antes de guardar.' : ''}`
            const value = document.getElementById('scheduled-at').value
            const date = new Date(value)
            document.getElementById('tournament-preview').textContent = value && !Number.isNaN(date.valueOf()) ? `En el torneo: ${new Intl.DateTimeFormat('es-AR', { timeZone: App.config.timeZone, dateStyle: 'medium', timeStyle: 'short' }).format(date)}` : ''
        }
        document.getElementById('scheduled-at').addEventListener('input', updateTimezonePreview)

        async function checkAuth() {
            const res = await App.fetch('/api/auth/me')
            if (!res.ok) { window.location.href = '/login.html'; throw new Error('Iniciá sesión.') }
        }

        async function loadData() {
            const [catsRes, teamsRes] = await Promise.all([
                App.fetch('/api/categories'),
                App.fetch('/api/teams'),
            ])
            const categories = await catsRes.json()
            allTeams = await teamsRes.json()

            document.getElementById('category').innerHTML =
                '<option value="">Seleccionar categoría...</option>' +
                categories.map(c => `<option value="${c.id}">${App.escape(c.name)}</option>`).join('')
            if (editingId) {
                const match = await App.json(`/api/matches/${editingId}`)
                document.title = 'Manager — Editar partido'
                document.getElementById('form-title').textContent = 'Editar partido'
                document.getElementById('save-button').textContent = 'Guardar cambios'
                document.getElementById('edit-note').classList.remove('hidden')
                document.getElementById('category').value = match.categoryId
                document.getElementById('category').dispatchEvent(new Event('change'))
                document.getElementById('team-home').value = match.teamHome.id
                document.getElementById('team-away').value = match.teamAway.id
                for (const id of ['category', 'team-home', 'team-away']) document.getElementById(id).disabled = true
                document.getElementById('court').value = match.court
                const local = new Date(match.scheduledAt)
                document.getElementById('scheduled-at').value = `${local.getFullYear()}-${String(local.getMonth()+1).padStart(2,'0')}-${String(local.getDate()).padStart(2,'0')}T${String(local.getHours()).padStart(2,'0')}:${String(local.getMinutes()).padStart(2,'0')}`
            }
            updateTimezonePreview()
        }

        document.getElementById('category').addEventListener('change', function () {
            const catId = Number(this.value)
            const filtered = catId ? allTeams.filter(t => t.categoryId === catId) : []
            const options = filtered.length > 0
                ? filtered.map(t => `<option value="${t.id}">${App.escape(t.name)}</option>`).join('')
                : '<option value="">Sin equipos en esta categoría</option>'

            document.getElementById('team-home').innerHTML = options
            document.getElementById('team-away').innerHTML = options
        })

        async function submitForm() {
            const categoryId = Number(document.getElementById('category').value)
            const teamHomeId = Number(document.getElementById('team-home').value)
            const teamAwayId = Number(document.getElementById('team-away').value)
            const court = document.getElementById('court').value
            const scheduledAt = document.getElementById('scheduled-at').value
            const errorEl = document.getElementById('form-error')

            if (!categoryId || !teamHomeId || !teamAwayId || !court || !scheduledAt) {
                errorEl.textContent = 'Completar todos los campos.'
                errorEl.classList.remove('hidden')
                return
            }

            if (teamHomeId === teamAwayId) {
                errorEl.textContent = 'El equipo local y visitante deben ser distintos.'
                errorEl.classList.remove('hidden')
                return
            }

            const button = document.getElementById('save-button')
            button.disabled = true
            try {
            const res = await App.fetch(editingId ? `/api/matches/${editingId}` : '/api/matches', {
                method: editingId ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...(editingId ? {} : { teamHomeId, teamAwayId, categoryId }), court, scheduledAt: new Date(scheduledAt).toISOString() }),
            })

            if (res.ok) {
                window.location.href = '/manager/'
            } else {
                errorEl.textContent = (await res.json()).error ?? 'No se pudo guardar el partido.'
                errorEl.classList.remove('hidden')
            }
            } finally { button.disabled = false }
        }

        App.ready.then(checkAuth).then(loadData)
    </script>
</body>
</html>
