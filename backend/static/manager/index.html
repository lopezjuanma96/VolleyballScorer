<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Partidos · Panel</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js"></script>
</head>
<body>
    <header class="bar"></header>
    <main class="page">
        <div class="spread">
            <h1 class="title">Partidos</h1>
            <a id="new-match" class="btn btn-primary hidden" href="/manager/match-form.html">Nuevo partido</a>
        </div>
        <p id="scorer-hint" class="small muted hidden" style="margin-top:4px">Como planillero podés iniciar partidos y anotar puntos. El fixture lo administra la organización.</p>
        <nav id="category-tabs" class="tabs" aria-label="Filtrar por categoría" style="margin-top:12px"></nav>
        <div id="match-list" aria-busy="true"><p class="empty">Cargando partidos…</p></div>
    </main>
    <script>
        let allMatches = [], allCategories = [], activeCategory = Number(new URLSearchParams(location.search).get('c')) || null
        const esc = App.escape

        function statusText(m) {
            if (m.status === 'in_progress') {
                const active = m.sets.find(s => s.status === 'in_progress')
                const sets = `${App.setsWon(m, 'home')}–${App.setsWon(m, 'away')} en sets`
                return `<span class="badge badge-live"><span class="live-dot"></span>${active ? `Set ${active.setNumber} · ${active.scoreHome}–${active.scoreAway}` : 'En juego'}</span> <span class="tiny muted">${sets}</span>`
            }
            if (m.status === 'upcoming') return '<span class="badge">Próximo</span>'
            const closed = m.sets.filter(s => s.status === 'finished_home' || s.status === 'finished_away')
            if (m.status === 'cancelled') return '<span class="badge">Cancelado</span>'
            return `<span class="badge">Final</span> <span class="tiny muted">${App.setsWon(m, 'home')}–${App.setsWon(m, 'away')} (${closed.map(s => `${s.scoreHome}-${s.scoreAway}`).join(', ')})</span>`
        }

        function row(m, withDate) {
            const quiet = m.status !== 'in_progress' && m.status !== 'upcoming'
            const when = withDate ? `${App.date(m.scheduledAt)} ${App.time(m.scheduledAt)}` : App.time(m.scheduledAt)
            return `<div class="list-row">
                <div class="grow">
                    <div class="${quiet ? 'muted' : ''}"><span class="muted num small">${when}</span> &nbsp;<strong>${esc(m.teamHome.name)}</strong> vs <strong>${esc(m.teamAway.name)}</strong></div>
                    <div class="small muted">${esc(m.categoryName)} · ${App.court(m.court)} · ${statusText(m)}</div>
                </div>
                <div class="row">
                    <a class="btn btn-sm ${quiet ? '' : 'btn-primary'}" href="/manager/game.html?id=${m.id}">Anotar</a>
                    <a class="btn btn-sm" href="/game.html?id=${m.id}">Ver</a>
                    ${App.isAdmin() ? `<a class="btn btn-sm" href="/manager/match-form.html?id=${m.id}">Editar</a>
                    <button type="button" class="btn btn-sm btn-danger" onclick="deleteMatch(${m.id})">Eliminar</button>` : ''}
                </div>
            </div>`
        }

        function render() {
            const filtered = (activeCategory ? allMatches.filter(m => m.categoryId === activeCategory) : allMatches).sort((a, b) => new Date(a.scheduledAt) - new Date(b.scheduledAt))
            const live = filtered.filter(m => m.status === 'in_progress')
            const done = filtered.filter(m => m.status !== 'in_progress' && m.status !== 'upcoming')
            const days = new Map()
            for (const m of filtered.filter(m => m.status === 'upcoming')) {
                const key = App.dayKey(m.scheduledAt)
                if (!days.has(key)) days.set(key, [])
                days.get(key).push(m)
            }
            const group = (label, rows) => `<section><h2 class="section">${esc(label)}</h2>${rows.map(m => row(m, false)).join('')}</section>`
            const wasOpen = document.getElementById('finished')?.open
            const html = (live.length ? group('En juego', live) : '')
                + [...days.values()].map(rows => group(App.day(rows[0].scheduledAt), rows)).join('')
                + (done.length ? `<details id="finished" style="margin-top:28px" ${wasOpen ? 'open' : ''}><summary>Terminados y cancelados (${done.length})</summary>${[...done].reverse().map(m => row(m, true)).join('')}</details>` : '')
            document.getElementById('match-list').innerHTML = html || '<p class="empty">Todavía no hay partidos.</p>'
            document.getElementById('match-list').setAttribute('aria-busy', 'false')
            document.getElementById('category-tabs').innerHTML = allCategories.length > 1 ? [{ id: null, name: 'Todas' }, ...allCategories].map(c => `<button type="button" class="tab" onclick="selectCategory(${c.id})" aria-pressed="${c.id === activeCategory}">${esc(c.name)}</button>`).join('') : ''
        }

        function selectCategory(id) {
            activeCategory = id
            history.replaceState(null, '', id ? `?c=${id}` : location.pathname)
            render()
        }

        async function deleteMatch(id) {
            if (!confirm('¿Eliminar este partido y todos sus datos?')) return
            const res = await App.send(`/api/matches/${id}`, 'DELETE')
            if (res.ok) { App.toast('Partido eliminado.'); await load() }
        }

        async function load() {
            const [matches, categories] = await Promise.all([App.json('/api/matches'), App.json('/api/categories')])
            allMatches = matches; allCategories = categories
            if (activeCategory && !categories.some(c => c.id === activeCategory)) activeCategory = null
            render()
        }

        App.ready.then(() => {
            document.getElementById('new-match').classList.toggle('hidden', !App.isAdmin())
            document.getElementById('scorer-hint').classList.toggle('hidden', App.isAdmin())
            return load()
        }).catch(() => {
            document.getElementById('match-list').innerHTML = '<p class="empty">No pudimos cargar los partidos. <button type="button" class="btn-link" onclick="location.reload()">Reintentar</button></p>'
        }).finally(() => App.watch(load))
    </script>
</body>
</html>
