<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equipos · Panel</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js"></script>
</head>
<body>
    <header class="bar"></header>
    <main class="page">
        <h1 class="title">Equipos</h1>

        <form id="team-form" class="panel stack" style="margin-top:16px" novalidate>
            <h2 class="section" id="form-title" style="margin:0">Nuevo equipo</h2>
            <div class="form-grid">
                <div class="field"><label for="team-name">Nombre</label><input type="text" id="team-name" maxlength="80" required /></div>
                <div class="field"><label for="team-club">Club</label><select id="team-club" required><option value="">Elegí un club…</option></select></div>
                <div class="field"><label for="team-category">Categoría</label><select id="team-category" required><option value="">Elegí una categoría…</option></select></div>
            </div>
            <p id="form-error" class="error hidden" role="alert"></p>
            <div class="row">
                <button type="submit" class="btn btn-primary" id="save-button">Crear equipo</button>
                <button type="button" class="btn hidden" id="cancel-button" onclick="resetForm()">Cancelar</button>
            </div>
        </form>

        <nav id="category-tabs" class="tabs" aria-label="Filtrar por categoría" style="margin-top:20px"></nav>
        <div id="team-list" aria-busy="true"><p class="empty">Cargando equipos…</p></div>
    </main>
    <script>
        let teams = [], clubs = [], categories = [], editingId = null, activeCategory = null
        const $ = id => document.getElementById(id)
        const esc = App.escape

        function showError(message) { $('form-error').textContent = message; $('form-error').classList.toggle('hidden', !message) }

        function render() {
            const clubName = id => clubs.find(c => c.id === id)?.name ?? '—'
            const categoryName = id => categories.find(c => c.id === id)?.name ?? '—'
            const shown = activeCategory ? teams.filter(t => t.categoryId === activeCategory) : teams
            $('category-tabs').innerHTML = categories.length > 1 ? [{ id: null, name: 'Todas' }, ...categories].map(c => `<button type="button" class="tab" onclick="selectCategory(${c.id})" aria-pressed="${c.id === activeCategory}">${esc(c.name)}</button>`).join('') : ''
            $('team-list').innerHTML = shown.map(t => `<div class="list-row">
                <div class="grow"><strong>${esc(t.name)}</strong><div class="small muted">${esc(clubName(t.clubId))} · ${esc(categoryName(t.categoryId))}</div></div>
                <div class="row">
                    <button type="button" class="btn btn-sm" onclick="editTeam(${t.id})">Editar</button>
                    <button type="button" class="btn btn-sm btn-danger" onclick="deleteTeam(${t.id})">Eliminar</button>
                </div>
            </div>`).join('') || '<p class="empty">No hay equipos.</p>'
            $('team-list').setAttribute('aria-busy', 'false')
        }

        function selectCategory(id) { activeCategory = id; render() }

        function editTeam(id) {
            const t = teams.find(t => t.id === id)
            if (!t) return
            editingId = id
            $('team-name').value = t.name
            $('team-club').value = t.clubId
            $('team-category').value = t.categoryId
            $('form-title').textContent = 'Editar equipo'
            $('save-button').textContent = 'Guardar cambios'
            $('cancel-button').classList.remove('hidden')
            showError('')
            $('team-name').focus()
            window.scrollTo({ top: 0, behavior: 'smooth' })
        }

        function resetForm() {
            editingId = null
            $('team-name').value = ''
            $('team-club').value = ''
            $('team-category').value = activeCategory ?? ''
            $('form-title').textContent = 'Nuevo equipo'
            $('save-button').textContent = 'Crear equipo'
            $('cancel-button').classList.add('hidden')
            showError('')
        }

        async function load() {
            ;[teams, clubs, categories] = await Promise.all([App.json('/api/teams'), App.json('/api/clubs'), App.json('/api/categories')])
            if (activeCategory && !categories.some(c => c.id === activeCategory)) activeCategory = null
            const selected = { club: $('team-club').value, category: $('team-category').value }
            $('team-club').innerHTML = '<option value="">Elegí un club…</option>' + clubs.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')
            $('team-category').innerHTML = '<option value="">Elegí una categoría…</option>' + categories.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')
            $('team-club').value = selected.club
            $('team-category').value = selected.category
            render()
        }

        $('team-form').addEventListener('submit', async event => {
            event.preventDefault()
            const name = $('team-name').value.trim(), clubId = Number($('team-club').value), categoryId = Number($('team-category').value)
            if (!name || !clubId || !categoryId) return showError('Completá nombre, club y categoría.')
            showError('')
            const button = $('save-button')
            button.disabled = true
            try {
                const res = await App.send(editingId ? `/api/teams/${editingId}` : '/api/teams', editingId ? 'PUT' : 'POST', { name, clubId, categoryId })
                if (!res.ok) return showError((await res.json().catch(() => ({}))).error ?? 'No se pudo guardar el equipo.')
                App.toast(editingId ? 'Equipo actualizado.' : 'Equipo creado.')
                resetForm()
                await load()
            } finally { button.disabled = false }
        })

        async function deleteTeam(id) {
            if (!confirm('¿Eliminar este equipo?')) return
            const res = await App.send(`/api/teams/${id}`, 'DELETE')
            if (res.ok) {
                App.toast('Equipo eliminado.')
                if (editingId === id) resetForm()
                await load()
            }
        }

        App.ready.then(() => {
            if (!App.isAdmin()) { document.querySelector('main').innerHTML = '<p class="empty">Solo la organización puede administrar equipos. <a href="/manager/">Volver a Partidos</a></p>'; return }
            return load()
        }).catch(() => { $('team-list').innerHTML = '<p class="empty">No pudimos cargar los equipos. <button type="button" class="btn-link" onclick="location.reload()">Reintentar</button></p>' })
    </script>
</body>
</html>
