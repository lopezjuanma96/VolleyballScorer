<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Clubes · Panel</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js"></script>
</head>
<body>
    <header class="bar"></header>
    <main class="page page-narrow">
        <h1 class="title">Clubes</h1>
        <section class="panel" style="margin-top:20px">
            <h2 class="section" id="form-title" style="margin-top:0">Crear club</h2>
            <form id="club-form" class="stack">
                <div class="field">
                    <label for="club-name">Nombre</label>
                    <input type="text" id="club-name" maxlength="100" required />
                </div>
                <div class="field">
                    <label for="club-logo">Logo (opcional)</label>
                    <input type="file" id="club-logo" accept="image/png,image/jpeg,image/webp" />
                    <p class="hint">PNG, JPG o WebP, hasta 2 MB. Si lo dejás vacío al editar, se conserva el logo actual.</p>
                </div>
                <div id="current-logo" class="row small muted hidden">
                    <img id="current-logo-image" class="logo" alt="" /> Logo actual
                </div>
                <p id="form-error" class="error hidden" role="alert"></p>
                <div class="row">
                    <button type="submit" class="btn btn-primary" id="save-club">Crear club</button>
                    <button type="button" class="btn hidden" id="cancel-edit">Cancelar</button>
                </div>
            </form>
        </section>
        <h2 class="section">Clubes cargados</h2>
        <p id="list-error" class="error hidden" role="alert"></p>
        <div id="club-list" aria-busy="true"><p class="empty">Cargando clubes…</p></div>
    </main>
    <script>
        let clubs = [], editingId = null
        const esc = App.escape
        const byId = id => document.getElementById(id)
        function showError(id, message) {
            const element = byId(id)
            element.textContent = message
            element.classList.remove('hidden')
        }
        async function responseError(response, fallback) {
            const body = await response.json().catch(() => ({}))
            return body.error ?? fallback
        }
        function renderClubs() {
            byId('club-list').innerHTML = clubs.map(club => `<div class="list-row">
                <div class="grow row">${club.logo ? `<img class="logo" src="${esc(club.logo)}" alt="" loading="lazy" />` : ''}<span>${esc(club.name)}</span></div>
                <div class="row">
                    <button type="button" class="btn btn-sm" onclick="editClub(${club.id})">Editar</button>
                    <button type="button" class="btn btn-sm btn-danger" onclick="deleteClub(${club.id})">Eliminar</button>
                </div>
            </div>`).join('') || '<p class="empty">Todavía no hay clubes.</p>'
            byId('club-list').setAttribute('aria-busy', 'false')
        }
        async function loadClubs() {
            try {
                clubs = await App.json('/api/clubs')
                byId('list-error').classList.add('hidden')
                renderClubs()
            } catch {
                byId('club-list').innerHTML = '<p class="empty">No pudimos cargar los clubes. <button class="btn-link" onclick="loadClubs()">Reintentar</button></p>'
                byId('club-list').setAttribute('aria-busy', 'false')
            }
        }
        function resetForm() {
            editingId = null
            byId('club-form').reset()
            byId('form-title').textContent = 'Crear club'
            byId('save-club').textContent = 'Crear club'
            byId('cancel-edit').classList.add('hidden')
            byId('current-logo').classList.add('hidden')
            byId('current-logo-image').removeAttribute('src')
            byId('form-error').classList.add('hidden')
        }
        function editClub(id) {
            const club = clubs.find(item => item.id === id)
            if (!club) return
            editingId = id
            byId('club-name').value = club.name
            byId('club-logo').value = ''
            byId('form-title').textContent = 'Editar club'
            byId('save-club').textContent = 'Guardar cambios'
            byId('cancel-edit').classList.remove('hidden')
            byId('current-logo').classList.toggle('hidden', !club.logo)
            if (club.logo) byId('current-logo-image').src = club.logo
            else byId('current-logo-image').removeAttribute('src')
            byId('form-error').classList.add('hidden')
            window.scrollTo({ top: 0, behavior: 'smooth' })
        }
        async function deleteClub(id) {
            const club = clubs.find(item => item.id === id)
            if (!club || !confirm(`¿Eliminar ${club.name}?`)) return
            byId('list-error').classList.add('hidden')
            try {
                const response = await App.fetch(`/api/clubs/${id}`, { method: 'DELETE' })
                if (!response.ok) {
                    showError('list-error', await responseError(response, 'No se pudo eliminar el club.'))
                    return
                }
                if (editingId === id) resetForm()
                App.toast('Club eliminado.')
                await loadClubs()
            } catch {
                showError('list-error', 'No hay conexión. No se pudo eliminar el club.')
            }
        }
        byId('club-form').addEventListener('submit', async event => {
            event.preventDefault()
            const button = byId('save-club')
            if (button.disabled) return
            const name = byId('club-name').value.trim()
            const logo = byId('club-logo').files[0]
            byId('form-error').classList.add('hidden')
            if (!name) return showError('form-error', 'El nombre es obligatorio.')
            if (logo && !['image/png', 'image/jpeg', 'image/webp'].includes(logo.type)) {
                return showError('form-error', 'Usá una imagen PNG, JPG o WebP.')
            }
            if (logo?.size > 2 * 1024 * 1024) return showError('form-error', 'El logo supera 2 MB.')
            const formData = new FormData()
            formData.append('name', name)
            if (logo) formData.append('logo', logo)
            button.disabled = true
            try {
                const response = await App.fetch(editingId ? `/api/clubs/${editingId}` : '/api/clubs', { method: editingId ? 'PUT' : 'POST', body: formData })
                if (!response.ok) {
                    showError('form-error', await responseError(response, 'No se pudo guardar el club.'))
                    return
                }
                resetForm()
                App.toast('Club guardado.')
                await loadClubs()
            } catch {
                showError('form-error', 'No hay conexión. No se pudo guardar el club.')
            } finally {
                button.disabled = false
            }
        })
        byId('cancel-edit').addEventListener('click', resetForm)
        App.ready.then(loadClubs)
    </script>
</body>
</html>
