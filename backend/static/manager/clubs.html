<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manager — Clubes</title>
    <link rel="stylesheet" href="/style.css" />
</head>
<body class="bg-gray-100 min-h-screen">

    <header class="bg-surface text-brand px-4 py-4 shadow flex items-center gap-3">
        <a href="/manager/" class="text-brand hover:text-brand-dark text-lg leading-none">←</a>
        <h1 class="text-lg font-bold tracking-wide">Clubes</h1>
    </header>

    <main class="px-4 py-4 max-w-2xl mx-auto space-y-4">

        <!-- Add / Edit form -->
        <div class="bg-white rounded-xl shadow p-4 space-y-3">
            <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider" id="form-title">Agregar club</h2>
            <input type="hidden" id="edit-id" value="" />
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                <input type="text" id="club-name"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Logo (opcional)</label>
                <label class="flex items-center gap-3 cursor-pointer">
                    <span class="bg-surface text-brand text-sm font-medium px-3 py-1.5 rounded-lg hover:bg-surface-light transition-colors shrink-0">
                        Seleccionar imagen
                    </span>
                    <span id="logo-filename" class="text-sm text-gray-400 truncate">Ningún archivo seleccionado</span>
                    <input type="file" id="club-logo" accept="image/*" class="hidden"
                        onchange="document.getElementById('logo-filename').textContent = this.files[0]?.name ?? 'Ningún archivo seleccionado'" />
                </label>
            </div>
            <div class="flex gap-2">
                <button onclick="submitForm()"
                    class="bg-surface text-brand text-sm font-semibold px-4 py-2 rounded-lg hover:bg-surface-light transition-colors">
                    Guardar
                </button>
                <button onclick="resetForm()" id="cancel-btn"
                    class="hidden text-sm text-gray-500 px-4 py-2 rounded-lg hover:bg-gray-100 transition-colors">
                    Cancelar
                </button>
            </div>
            <p id="form-error" class="text-red-500 text-sm hidden"></p>
        </div>

        <!-- List -->
        <div id="club-list">
            <p class="text-gray-400 text-sm text-center py-8">Cargando...</p>
        </div>
    </main>

    <script>
        async function checkAuth() {
            const res = await fetch('/api/auth/me')
            if (!res.ok) window.location.href = '/login.html'
        }

        async function loadClubs() {
            try {
                const res = await fetch('/api/clubs')
                if (!res.ok) throw new Error()
                const clubs = await res.json()

                if (clubs.length === 0) {
                    document.getElementById('club-list').innerHTML =
                        '<p class="text-gray-400 text-sm text-center py-4">No hay clubes.</p>'
                    return
                }

                document.getElementById('club-list').innerHTML = `
                    <div class="space-y-2">
                        ${clubs.map(c => `
                            <div class="bg-white rounded-xl shadow p-4 flex items-center gap-4">
                                ${c.logo
                                    ? `<img src="${c.logo}" class="w-10 h-10 object-contain rounded shrink-0" />`
                                    : '<div class="w-10 h-10 bg-gray-100 rounded flex items-center justify-center text-gray-400 text-xs shrink-0">Sin logo</div>'}
                                <span class="flex-1 font-medium text-gray-800">${c.name}</span>
                                <div class="flex gap-3">
                                    <button onclick="editClub(${c.id}, '${c.name.replace(/'/g, "\\'")}')"
                                        class="text-sm text-brand font-medium hover:underline">Editar</button>
                                    <button onclick="deleteClub(${c.id})"
                                        class="text-sm text-red-500 hover:underline">Eliminar</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `
            } catch {
                document.getElementById('club-list').innerHTML =
                    '<p class="text-red-500 text-sm text-center py-4">Error al cargar los clubes.</p>'
            }
        }

        function editClub(id, name) {
            document.getElementById('edit-id').value = id
            document.getElementById('club-name').value = name
            document.getElementById('form-title').textContent = 'Editar club'
            document.getElementById('cancel-btn').classList.remove('hidden')
            window.scrollTo({ top: 0, behavior: 'smooth' })
        }

        function resetForm() {
            document.getElementById('edit-id').value = ''
            document.getElementById('club-name').value = ''
            document.getElementById('club-logo').value = ''
            document.getElementById('logo-filename').textContent = 'Ningún archivo seleccionado'
            document.getElementById('form-title').textContent = 'Agregar club'
            document.getElementById('cancel-btn').classList.add('hidden')
            document.getElementById('form-error').classList.add('hidden')
        }

        async function submitForm() {
            const id = document.getElementById('edit-id').value
            const name = document.getElementById('club-name').value.trim()
            const logoFile = document.getElementById('club-logo').files[0]
            const errorEl = document.getElementById('form-error')

            if (!name) {
                errorEl.textContent = 'El nombre es obligatorio.'
                errorEl.classList.remove('hidden')
                return
            }

            const formData = new FormData()
            formData.append('name', name)
            if (logoFile) formData.append('logo', logoFile)

            const url = id ? `/api/clubs/${id}` : '/api/clubs'
            const method = id ? 'PUT' : 'POST'

            try {
                const res = await fetch(url, { method, body: formData })
                if (!res.ok) throw new Error()
                resetForm()
                loadClubs()
            } catch {
                errorEl.textContent = 'Error al guardar el club.'
                errorEl.classList.remove('hidden')
            }
        }

        async function deleteClub(id) {
            if (!confirm('¿Eliminar este club?')) return
            const res = await fetch(`/api/clubs/${id}`, { method: 'DELETE' })
            if (res.ok) loadClubs()
            else alert('Error al eliminar. Puede que tenga equipos asociados.')
        }

        checkAuth().then(loadClubs)
    </script>
</body>
</html>
