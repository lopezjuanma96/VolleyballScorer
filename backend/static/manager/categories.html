<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categorías · Panel</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js"></script>
</head>
<body>
    <header class="bar"></header>
    <main class="page">
        <h1 class="title">Categorías</h1>
        <p class="small muted" data-tip="categories" style="margin-top:4px">Cada categoría define las reglas de sus partidos. Los cambios de reglas se aplican a los partidos que se creen después; los ya creados conservan las suyas.</p>

        <form id="category-form" class="panel stack" style="margin-top:16px" novalidate>
            <h2 class="section" id="form-title" style="margin:0">Nueva categoría</h2>
            <div class="form-grid">
                <div class="field"><label for="category-name">Nombre</label><input type="text" id="category-name" maxlength="80" placeholder="Ej: Masculino A" required /></div>
            </div>
            <div id="rules"></div>
            <p id="form-error" class="error hidden" role="alert"></p>
            <div class="row">
                <button type="submit" class="btn btn-primary" id="save-button">Crear categoría</button>
                <button type="button" class="btn hidden" id="cancel-button" onclick="resetForm()">Cancelar</button>
            </div>
        </form>

        <div id="category-list" aria-busy="true"><p class="empty">Cargando categorías…</p></div>
    </main>
    <script>
        let categories = [], editingId = null
        const $ = id => document.getElementById(id)
        const rules = App.ruleForm($('rules'))
        rules.fill(App.RULE_DEFAULTS)

        function showError(message) { $('form-error').textContent = message; $('form-error').classList.toggle('hidden', !message) }

        function render() {
            $('category-list').innerHTML = categories.map(c => `<div class="list-row">
                <div class="grow"><strong>${App.escape(c.name)}</strong><div class="small muted">${App.escape(App.rulesText(c))}</div></div>
                <div class="row">
                    <button type="button" class="btn btn-sm" onclick="editCategory(${c.id})">Editar</button>
                    <button type="button" class="btn btn-sm btn-danger" onclick="deleteCategory(${c.id})">Eliminar</button>
                </div>
            </div>`).join('') || '<p class="empty">Todavía no hay categorías.</p>'
            $('category-list').setAttribute('aria-busy', 'false')
        }

        function editCategory(id) {
            const c = categories.find(c => c.id === id)
            if (!c) return
            editingId = id
            $('category-name').value = c.name
            rules.fill(c)
            $('form-title').textContent = 'Editar categoría'
            $('save-button').textContent = 'Guardar cambios'
            $('cancel-button').classList.remove('hidden')
            showError('')
            $('category-name').focus()
            window.scrollTo({ top: 0, behavior: 'smooth' })
        }

        function resetForm() {
            editingId = null
            $('category-name').value = ''
            rules.fill(App.RULE_DEFAULTS)
            $('form-title').textContent = 'Nueva categoría'
            $('save-button').textContent = 'Crear categoría'
            $('cancel-button').classList.add('hidden')
            showError('')
        }

        async function load() { categories = await App.json('/api/categories'); render() }

        $('category-form').addEventListener('submit', async event => {
            event.preventDefault()
            const name = $('category-name').value.trim()
            if (!name) return showError('El nombre es obligatorio.')
            showError('')
            const button = $('save-button')
            button.disabled = true
            try {
                const res = await App.send(editingId ? `/api/categories/${editingId}` : '/api/categories', editingId ? 'PUT' : 'POST', { name, ...rules.read() })
                if (!res.ok) return showError((await res.json().catch(() => ({}))).error ?? 'No se pudo guardar la categoría.')
                App.toast(editingId ? 'Categoría actualizada.' : 'Categoría creada.')
                resetForm()
                await load()
            } finally { button.disabled = false }
        })

        async function deleteCategory(id) {
            if (!confirm('¿Eliminar esta categoría?')) return
            const res = await App.send(`/api/categories/${id}`, 'DELETE')
            if (res.ok) {
                App.toast('Categoría eliminada.')
                if (editingId === id) resetForm()
                await load()
            }
        }

        App.ready.then(() => {
            if (!App.isAdmin()) { document.querySelector('main').innerHTML = '<p class="empty">Solo la organización puede administrar categorías. <a href="/manager/">Volver a Partidos</a></p>'; return }
            return load()
        }).catch(() => { $('category-list').innerHTML = '<p class="empty">No pudimos cargar las categorías. <button type="button" class="btn-link" onclick="location.reload()">Reintentar</button></p>' })
    </script>
</body>
</html>
