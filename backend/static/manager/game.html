<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planilla · Panel</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js"></script>
</head>
<body>
    <header class="bar"></header>
    <main class="page page-narrow">
        <div id="score"><p class="empty">Cargando…</p></div>
        <div id="setup"></div>
        <div id="admin"></div>
        <details id="history" style="margin-top:24px" ontoggle="if (this.open) loadHistory()"><summary>Historial de decisiones</summary><div id="history-list" class="stack-sm" style="margin-top:8px"><p class="small muted">Cargando…</p></div></details>
    </main>

    <dialog id="sub-dialog" aria-labelledby="sub-title">
        <form onsubmit="submitSubstitution(event)" class="stack">
            <h2 id="sub-title" class="title" style="font-size:18px">Cambio</h2>
            <div class="form-grid">
                <div class="field"><label for="sub-out">Sale</label><select id="sub-out" required></select></div>
                <div class="field"><label for="sub-in">Entra (número)</label><input id="sub-in" type="number" inputmode="numeric" min="0" max="99" required /></div>
            </div>
            <p class="tiny muted">El jugador que entra ocupa la misma posición. El líbero no se registra.</p>
            <div class="row"><button type="submit" class="btn btn-primary">Registrar cambio</button><button type="button" class="btn" onclick="this.closest('dialog').close()">Volver</button></div>
        </form>
    </dialog>

    <dialog id="adjustment-dialog" aria-labelledby="adjustment-title">
        <form onsubmit="submitAdjustment(event)" class="stack">
            <h2 id="adjustment-title" class="title" style="font-size:18px"></h2>
            <p id="adjustment-description" class="small muted"></p>
            <div id="correction-fields" class="stack-sm">
                <div class="form-grid">
                    <div class="field"><label for="correction-home">Puntos local</label><input id="correction-home" type="number" min="0" max="999" required /></div>
                    <div class="field"><label for="correction-away">Puntos visitante</label><input id="correction-away" type="number" min="0" max="999" required /></div>
                </div>
                <div class="field"><label for="correction-status">Resultado del set</label><select id="correction-status"></select></div>
            </div>
            <div class="field"><label for="adjustment-reason">Motivo (queda en el historial)</label><textarea id="adjustment-reason" minlength="3" maxlength="500" required rows="3"></textarea></div>
            <p id="adjustment-error" role="alert" class="error"></p>
            <div class="row"><button id="adjustment-submit" type="submit" class="btn btn-primary">Confirmar y guardar</button><button type="button" class="btn" onclick="this.closest('dialog').close()">Volver</button></div>
        </form>
    </dialog>

    <script>
        const matchId = new URLSearchParams(location.search).get('id')
        const esc = App.escape
        const POSITIONS = ['I', 'II', 'III', 'IV', 'V', 'VI']
        // Court order as seen from the team's own side: front IV III II, back V VI I.
        const COURT_ORDER = [3, 2, 1, 4, 5, 0]
        let m = null, history = [], adjustment = null, subSide = null, busy = false, setupDirty = false, setupFor = null

        const activeSet = () => m.sets.find(s => s.status === 'in_progress') ?? null
        const teamName = side => esc(side === 'home' ? m.teamHome.name : m.teamAway.name)
        // The last undoable entry of the match: the latest point of the most recent set that has points.
        function lastEntry() {
            const set = [...m.sets].sort((a, b) => b.setNumber - a.setNumber).find(s => s.points.length)
            const point = set?.points.at(-1)
            if (!set || !point || point.kind === 'correction' || set.status === 'cancelled') return null
            return { set, point }
        }

        async function load() {
            if (!/^\d+$/.test(matchId ?? '')) throw new Error('Partido no encontrado.')
            m = await App.json(`/api/matches/${matchId}`)
            render()
            if (document.getElementById('history').open) await loadHistory()
        }

        function court(positions, serving, side) {
            return `<div class="court" aria-label="Rotación de ${teamName(side)}">${COURT_ORDER.map(i => `<div class="${serving && i === 0 ? 'server' : ''}">${positions[i]}<small>${POSITIONS[i]}</small></div>`).join('')}</div>`
        }

        function render() {
            document.title = `${m.teamHome.name} vs ${m.teamAway.name} · Planilla`
            renderScore()
            const active = activeSet()
            // Do not overwrite a lineup the scorer is typing when another device scores.
            if (!setupDirty || setupFor !== active?.id) renderSetup()
            renderAdmin()
        }

        function renderScore() {
            const active = activeSet()
            const live = m.status === 'in_progress'
            const won = side => App.setsWon(m, side)
            const serving = active?.rotation?.serving
            const winner = App.winner(m)
            const last = lastEntry()
            const header = `<p class="small"><a href="/manager/" class="muted">← Partidos</a></p>
                <div class="spread small muted" style="margin-top:12px"><span>${esc(m.categoryName)} · ${App.court(m.court)} · ${App.date(m.scheduledAt)} ${App.time(m.scheduledAt)}</span>${live ? '<span class="badge badge-live"><span class="live-dot"></span>En juego</span>' : `<span class="badge">${App.statusLabel(m.status)}</span>`}</div>`
            const scoreline = `<div class="scoreline">
                    <div class="side"><div class="team-name">${teamName('home')}${serving === 'home' ? '<span class="serve" title="Saca"></span>' : ''}</div><div class="club">Sets ${won('home')}</div></div>
                    <div><div class="big">${active ? `${active.scoreHome}–${active.scoreAway}` : `${won('home')}–${won('away')}`}</div><div class="under">${active ? `Set ${active.setNumber}` : winner ? `Ganó ${esc(winner.name)}` : App.statusLabel(m.status)}</div></div>
                    <div class="side"><div class="team-name">${serving === 'away' ? '<span class="serve" title="Saca"></span>' : ''}${teamName('away')}</div><div class="club">Sets ${won('away')}</div></div>
                </div>`
            let body = ''
            if (m.status === 'upcoming') {
                body = `<div class="stack" style="margin-top:20px"><p class="small muted">${App.rulesText(m.rules)}</p><button class="btn btn-primary btn-point" onclick="act(startMatch)">Iniciar partido</button></div>`
            } else if (live && active) {
                body = `<div class="form-grid" style="margin-top:20px;grid-template-columns:1fr 1fr">
                        <button class="btn btn-primary btn-point" onclick="act(addPoint, true)">+ ${teamName('home')}</button>
                        <button class="btn btn-primary btn-point" onclick="act(addPoint, false)">+ ${teamName('away')}</button>
                    </div>
                    <div class="spread" style="margin-top:12px">
                        <button class="btn" onclick="act(undo)" ${last ? '' : 'disabled'}>↶ Deshacer último punto</button>
                        <span class="tiny muted">${App.rulesText(m.rules)}</span>
                    </div>
                    ${rotationBlock(active)}
                    <details class="panel" style="margin-top:20px"><summary>Cargar resultado final del set ${active.setNumber}</summary>
                        <p class="tiny muted" style="margin:8px 0">Para cuando no se anota punto a punto. El ganador se calcula con las reglas del partido.</p>
                        <div class="form-grid"><div class="field"><label for="final-home">${teamName('home')}</label><input id="final-home" type="number" inputmode="numeric" min="0" max="999" value="${active.scoreHome}" /></div>
                        <div class="field"><label for="final-away">${teamName('away')}</label><input id="final-away" type="number" inputmode="numeric" min="0" max="999" value="${active.scoreAway}" /></div></div>
                        <button class="btn" style="margin-top:12px" onclick="act(finishSet)">Guardar resultado del set</button>
                    </details>`
            } else {
                body = `<div class="stack" style="margin-top:20px">
                    <p class="small muted">${m.status === 'cancelled' ? 'Partido cancelado.' : winner ? `Partido terminado. Ganó ${esc(winner.name)}.` : 'Partido detenido.'}</p>
                    ${last && m.status !== 'cancelled' ? `<button class="btn" onclick="act(undo)">↶ Deshacer último punto (reabre el partido)</button>` : ''}</div>`
            }
            const sets = m.sets.filter(s => s.status !== 'in_progress')
            const setList = sets.length ? `<h2 class="section">Sets</h2>${sets.map(s => `<div class="list-row"><span class="grow">Set ${s.setNumber} · <span class="num">${s.scoreHome}–${s.scoreAway}</span> <span class="muted small">· ${s.status === 'cancelled' ? 'cancelado' : `ganó ${teamName(s.status.slice(9))}`}</span></span>${App.isAdmin() ? `<button class="btn btn-sm" onclick="openAdjustment(${s.id}, 'correct')">Corregir</button>` : ''}</div>`).join('')}` : ''
            document.getElementById('score').innerHTML = header + scoreline + body + setList
        }

        function rotationBlock(set) {
            const r = set.rotation
            if (!r.positions.home && !r.positions.away) return ''
            const changes = set.substitutions
            const lastChange = changes.at(-1)
            const rallies = set.points.filter(p => p.kind === 'rally').length
            const side = key => r.positions[key] ? `<div><div class="spread" style="margin-bottom:6px"><span class="small">${teamName(key)}${r.serving === key ? ' · saca' : ''}</span><button class="btn btn-sm" onclick="openSubstitution('${key}')">Cambio</button></div>${court(r.positions[key], r.serving === key, key)}</div>` : ''
            return `<h2 class="section">Rotación</h2><div class="courts">${side('home')}${side('away')}</div>
                ${changes.length ? `<p class="tiny muted" style="margin-top:8px">Cambios: ${changes.map(c => `${teamName(c.side)} ${c.playerOut}→${c.playerIn}`).join(' · ')}
                ${lastChange.afterRallies === rallies ? ` <button class="btn-link tiny" onclick="act(undoSubstitution, ${lastChange.id})">deshacer último</button>` : ''}</p>` : ''}`
        }

        // Toss and starting lineup for the set in play.
        function renderSetup() {
            const active = activeSet()
            setupDirty = false
            setupFor = active?.id ?? null
            if (!active || m.status !== 'in_progress') { document.getElementById('setup').innerHTML = ''; return }
            const started = active.points.length > 0
            // Teams often repeat their lineup: offer the previous set's, saved only on "Guardar".
            const previous = [...m.sets].filter(s => s.setNumber < active.setNumber).sort((a, b) => b.setNumber - a.setNumber)
            const lineupInputs = side => {
                const saved = active.lineups[side]
                const current = saved ?? previous.find(s => s.lineups[side])?.lineups[side]
                return `<div><p class="small" style="margin-bottom:6px">${teamName(side)}${!saved && current ? ' <span class="tiny muted">· precargada del set anterior</span>' : ''}</p><div class="court">${COURT_ORDER.map(i => `<div><input class="input num" style="text-align:center;padding:6px 2px" type="number" inputmode="numeric" min="0" max="99" id="lineup-${side}-${i}" aria-label="${teamName(side)} posición ${POSITIONS[i]}" value="${current ? current[i] : ''}" /><small>${POSITIONS[i]}</small></div>`).join('')}</div></div>`
            }
            const serve = active.firstServeHome
            const form = `<div class="stack" style="margin-top:12px" oninput="setupDirty = true">
                    <fieldset class="row"><legend class="small muted" style="margin-bottom:6px">Saca primero</legend>
                        <label class="check"><input type="radio" name="first-serve" value="home" ${serve === true ? 'checked' : ''}> ${teamName('home')}</label>
                        <label class="check"><input type="radio" name="first-serve" value="away" ${serve === false ? 'checked' : ''}> ${teamName('away')}</label>
                    </fieldset>
                    <p class="tiny muted">Números de camiseta según la planilla. Arriba la red (IV III II), abajo la línea de fondo (V VI I). La posición I saca. Podés cargar un solo equipo.</p>
                    <div class="courts">${lineupInputs('home')}${lineupInputs('away')}</div>
                    ${started ? '<p class="tiny muted">El set ya empezó: al guardar, la rotación se recalcula con todos los puntos anotados.</p>' : ''}
                    <div class="row"><button class="btn btn-primary" onclick="act(saveLineup)">Guardar formación</button></div>
                </div>`
            const complete = serve !== null && active.lineups.home && active.lineups.away
            document.getElementById('setup').innerHTML = `<details class="panel" style="margin-top:20px" ${complete || started ? '' : 'open'}><summary>Saque y formación inicial · set ${active.setNumber}${complete ? ' ✓' : ''}</summary>${form}</details>`
        }

        function renderAdmin() {
            if (!App.isAdmin()) { document.getElementById('admin').innerHTML = ''; return }
            if (document.querySelector('#admin :focus')) return
            const active = activeSet()
            const latest = m.sets.at(-1)
            const statuses = [['upcoming', 'Próximo'], ['in_progress', 'En juego'], ['finished_home', `Ganó ${teamName('home')}`], ['finished_away', `Ganó ${teamName('away')}`], ['cancelled', 'Cancelado']]
            document.getElementById('admin').innerHTML = `<h2 class="section">Organización</h2>
                <div class="stack">
                    <p class="small muted">Decisiones administrativas: quedan en el historial. Usalas para walkover, abandono o errores de planilla. <a class="btn-link" href="/manager/match-form.html?id=${m.id}">Editar horario, cancha o reglas</a>.</p>
                    <div><p class="small" style="margin-bottom:6px">Estado oficial del partido</p><div class="row">${statuses.map(([value, label]) => `<button class="btn btn-sm" ${m.status === value ? 'aria-pressed="true" style="border-color:var(--ink);font-weight:600"' : ''} onclick="act(updateMatchStatus, '${value}')">${label}</button>`).join('')}</div></div>
                    ${active && m.status === 'in_progress' ? `<div><button class="btn btn-sm btn-danger" onclick="act(cancelSet)">Cancelar set ${active.setNumber}</button></div>` : ''}
                    ${m.status !== 'in_progress' && latest?.status === 'cancelled' && latest.points.length ? `<div class="panel small"><p>¿Se cerró el partido por error? El último set conserva ${latest.scoreHome}–${latest.scoreAway}.</p><button class="btn btn-sm" style="margin-top:8px" onclick="openAdjustment(${latest.id}, 'recover')">Recuperar último set</button></div>` : ''}
                </div>`
        }

        // The history panel stays outside the re-rendered sections so opening it is stable.
        function renderHistory() {
            const labels = { set_correction: 'Corrección de set', set_recovery: 'Recuperación de set', match_close: 'Cierre con set activo', match_status: 'Estado del partido', set_cancel: 'Set cancelado', set_lineup: 'Saque y formación' }
            document.getElementById('history-list').innerHTML = history.map(e => `<div class="list-row small"><div class="grow"><strong>${esc(labels[e.action] ?? e.action)}</strong>${e.setId ? ` · set ${m.sets.find(s => s.id === e.setId)?.setNumber ?? '—'}` : ''}<br><span class="muted">${esc(e.reason)}${auditState(e.before) || auditState(e.after) ? ' · ' : ''}${esc(auditState(e.before))}${auditState(e.before) && auditState(e.after) ? ' → ' : ''}${esc(auditState(e.after))}</span></div><span class="tiny muted">${esc(e.actor)} · ${App.date(e.createdAt)} ${App.time(e.createdAt)}</span></div>`).join('') || '<p class="small muted">Sin decisiones registradas.</p>'
        }
        async function loadHistory() { history = await App.json(`/api/matches/${matchId}/history`); renderHistory() }
        function auditState(value) {
            const labels = { upcoming: 'Próximo', in_progress: 'En juego', finished_home: 'Ganó local', finished_away: 'Ganó visitante', cancelled: 'Cancelado' }
            return [value.matchStatus ? `Partido: ${labels[value.matchStatus]}` : '', value.status ? `Set: ${labels[value.status]}` : '', value.scoreHome !== undefined ? `${value.scoreHome}–${value.scoreAway}` : ''].filter(Boolean).join(' · ')
        }

        // --- Actions (one at a time; every result comes from the server) ---
        async function act(fn, ...args) {
            if (busy) return
            busy = true
            const paused = [...document.querySelectorAll('main button:not(:disabled)')]
            paused.forEach(b => { b.disabled = true })
            try { await fn(...args) }
            catch { App.toast('No pudimos guardar el cambio. Revisá el marcador antes de reintentar.', true) }
            finally {
                busy = false
                await load().catch(() => {})
                // Sections kept on screen (e.g. a lineup being typed) get their buttons back.
                paused.forEach(b => { b.disabled = false })
            }
        }
        async function startMatch() {
            const res = await App.send(`/api/matches/${m.id}`, 'PUT', { status: 'in_progress', expectedStatus: 'upcoming' })
            if (res.ok) App.toast('Partido iniciado. Cargá el saque y las formaciones si las tenés.')
        }
        function announce(result) {
            if (result.matchWinner) App.toast(`Partido terminado. Ganó ${result.matchWinner === 'home' ? m.teamHome.name : m.teamAway.name}.`)
            else if (result.setWinner) App.toast(`Set para ${result.setWinner === 'home' ? m.teamHome.name : m.teamAway.name}. Empieza el set siguiente.`)
        }
        async function addPoint(homeScored) {
            const active = activeSet()
            if (!active) return
            const res = await App.send('/api/points', 'POST', { setId: active.id, homeScored })
            if (res.ok) announce(await res.json())
        }
        async function undo() {
            const last = lastEntry()
            if (!last) return
            const closed = last.set.status !== 'in_progress'
            if (closed && !confirm(`El último punto cerró el set ${last.set.setNumber}${m.status !== 'in_progress' ? ' y el partido' : ''}. ¿Deshacerlo y reabrir${m.status !== 'in_progress' ? 'los' : 'lo'}?${m.status === 'in_progress' ? ' Se descarta la formación cargada para el set siguiente.' : ''}`)) return
            const res = await App.send(`/api/points/${last.point.id}`, 'DELETE')
            if (res.ok && closed) App.toast('Punto deshecho. El set volvió a estar en juego.')
        }
        async function finishSet() {
            const active = activeSet()
            const scoreHome = Number(document.getElementById('final-home').value), scoreAway = Number(document.getElementById('final-away').value)
            if (!confirm(`¿Cerrar el set ${active.setNumber} con ${scoreHome}–${scoreAway}?`)) return
            const res = await App.send(`/api/sets/${active.id}/finish`, 'POST', { scoreHome, scoreAway, expectedLastPointId: active.points.at(-1)?.id ?? null })
            if (res.ok) announce(await res.json())
        }
        async function saveLineup() {
            const active = activeSet()
            const serve = document.querySelector('input[name="first-serve"]:checked')?.value
            const body = { firstServeHome: serve ? serve === 'home' : null }
            for (const side of ['home', 'away']) {
                const values = [0, 1, 2, 3, 4, 5].map(i => document.getElementById(`lineup-${side}-${i}`).value.trim())
                if (values.every(v => v === '')) { body[side] = null; continue }
                if (values.some(v => v === '')) return App.toast(`Completá las 6 posiciones de ${side === 'home' ? m.teamHome.name : m.teamAway.name} o dejalas vacías.`, true)
                body[side] = values.map(Number)
                if (new Set(body[side]).size !== 6) return App.toast(`Hay números repetidos en ${side === 'home' ? m.teamHome.name : m.teamAway.name}.`, true)
            }
            const res = await App.send(`/api/sets/${active.id}/lineup`, 'PUT', body)
            if (res.ok) { setupDirty = false; App.toast('Formación guardada.') }
        }
        function openSubstitution(side) {
            const active = activeSet()
            if (!active || busy) return
            subSide = side
            document.getElementById('sub-title').textContent = `Cambio · ${side === 'home' ? m.teamHome.name : m.teamAway.name}`
            document.getElementById('sub-out').innerHTML = active.rotation.positions[side].map((n, i) => `<option value="${n}">${n} (posición ${POSITIONS[i]})</option>`).join('')
            document.getElementById('sub-in').value = ''
            document.getElementById('sub-dialog').showModal()
        }
        function submitSubstitution(event) {
            event.preventDefault()
            const active = activeSet()
            const body = { side: subSide, playerOut: Number(document.getElementById('sub-out').value), playerIn: Number(document.getElementById('sub-in').value) }
            document.getElementById('sub-dialog').close()
            act(async () => { const res = await App.send(`/api/sets/${active.id}/substitutions`, 'POST', body); if (res.ok) App.toast(`Cambio: entra ${body.playerIn} por ${body.playerOut}.`) })
        }
        async function undoSubstitution(id) { await App.send(`/api/sets/${activeSet().id}/substitutions/${id}`, 'DELETE') }

        // --- Admin rulings ---
        async function cancelSet() {
            const active = activeSet()
            if (!confirm(`¿Cancelar el set ${active.setNumber} (${active.scoreHome}–${active.scoreAway})? No cuenta como ganado y empieza otro desde 0–0.`)) return
            await App.send(`/api/sets/${active.id}`, 'PUT', { status: 'cancelled', expectedLastPointId: active.points.at(-1)?.id ?? null })
        }
        async function updateMatchStatus(status) {
            if (status === m.status) return
            const active = activeSet()
            const closing = !['in_progress', 'upcoming'].includes(status)
            if (closing && !confirm(`¿Registrar "${{ finished_home: `Ganó ${m.teamHome.name}`, finished_away: `Ganó ${m.teamAway.name}`, cancelled: 'Cancelado' }[status]}" como resultado oficial?${active?.points.length ? `\n\nEl set ${active.setNumber} (${active.scoreHome}–${active.scoreAway}) quedará cancelado; sus puntos se conservan para poder recuperarlo.` : ''}`)) return
            const latest = m.sets.at(-1)
            const startNewSet = status === 'in_progress' && !active && latest?.status === 'cancelled' && latest.points.length > 0
            if (startNewSet && !confirm('El último set cancelado conserva puntos. Podés recuperarlo con "Recuperar último set". ¿Preferís iniciar un set NUEVO desde 0–0?')) return
            await App.send(`/api/matches/${m.id}`, 'PUT', { status, expectedStatus: m.status, ...(closing ? { expectedActiveSet: active ? { id: active.id, lastPointId: active.points.at(-1)?.id ?? null } : null } : {}), ...(startNewSet ? { startNewSet: true } : {}) })
        }
        function openAdjustment(id, mode) {
            const set = m.sets.find(s => s.id === id)
            if (!set || busy) return
            adjustment = { set: structuredClone(set), mode, matchStatus: m.status }
            document.getElementById('adjustment-title').textContent = `${mode === 'recover' ? 'Recuperar' : 'Corregir'} set ${set.setNumber}`
            document.getElementById('adjustment-description').textContent = mode === 'recover'
                ? `Se retoma el marcador ${set.scoreHome}–${set.scoreAway} y el partido vuelve a estar en juego.`
                : 'Resultado administrativo del set. Se conserva el historial anterior; el resultado oficial del partido no cambia solo: ajustalo aparte si corresponde.'
            document.getElementById('correction-fields').hidden = mode === 'recover'
            document.getElementById('correction-home').value = set.scoreHome
            document.getElementById('correction-away').value = set.scoreAway
            document.getElementById('correction-status').innerHTML = [['finished_home', `Ganó ${m.teamHome.name}`], ['finished_away', `Ganó ${m.teamAway.name}`], ['cancelled', 'Cancelado']].map(([value, label]) => `<option value="${value}">${esc(label)}</option>`).join('')
            document.getElementById('correction-status').value = set.status
            document.getElementById('adjustment-reason').value = ''
            document.getElementById('adjustment-error').textContent = ''
            document.getElementById('adjustment-dialog').showModal()
        }
        async function submitAdjustment(event) {
            event.preventDefault()
            if (!adjustment || busy) return
            const { set, mode, matchStatus } = adjustment
            const reason = document.getElementById('adjustment-reason').value.trim()
            if (reason.length < 3) { document.getElementById('adjustment-error').textContent = 'Escribí un motivo de al menos 3 caracteres.'; return }
            busy = true
            document.getElementById('adjustment-submit').disabled = true
            try {
                const response = await App.send(`/api/sets/${set.id}/${mode}`, 'POST', { expectedStatus: set.status, expectedRevision: set.revision, expectedLastPointId: set.points.at(-1)?.id ?? null, reason,
                    ...(mode === 'recover' ? { expectedMatchStatus: matchStatus } : { scoreHome: Number(document.getElementById('correction-home').value), scoreAway: Number(document.getElementById('correction-away').value), status: document.getElementById('correction-status').value }) })
                if (!response.ok) {
                    document.getElementById('adjustment-error').textContent = (await response.json()).error
                    if (response.status === 409) { document.getElementById('adjustment-dialog').close(); await load() }
                    return
                }
                document.getElementById('adjustment-dialog').close()
                App.toast(mode === 'recover' ? 'Set recuperado. El partido está en juego.' : 'Corrección registrada con su motivo.')
                await load()
            } finally { busy = false; document.getElementById('adjustment-submit').disabled = false }
        }

        App.ready.then(load).catch(() => {
            document.getElementById('score').innerHTML = '<p class="empty">No pudimos cargar el partido. <a href="/manager/">Volver</a></p>'
        }).finally(() => { if (/^\d+$/.test(matchId ?? '')) App.watch(() => busy ? Promise.resolve() : load()) })
    </script>
</body>
</html>
