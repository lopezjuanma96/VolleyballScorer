<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planilla · Panel</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js"></script>
</head>
<body>
    <header class="bar"></header>
    <main class="page page-narrow">
        <div id="score"><p class="empty">Cargando…</p></div>
        <div id="setup"></div>
        <div id="admin"></div>
        <details id="history" style="margin-top:24px" ontoggle="if (this.open) loadHistory()"><summary>Historial de decisiones</summary><div id="history-list" class="stack-sm" style="margin-top:8px"><p class="small muted">Cargando…</p></div></details>
    </main>

    <dialog id="sub-dialog" aria-labelledby="sub-title">
        <form onsubmit="submitSubstitution(event)" class="stack">
            <h2 id="sub-title" class="title" style="font-size:18px"><span id="sub-title-text">Cambio</span></h2>
            <p class="small muted" data-tip="substitution">El jugador que entra ocupa la misma posición. El líbero no se registra.</p>
            <div class="form-grid">
                <div class="field"><label for="sub-out">Sale</label><select id="sub-out" required></select></div>
                <div class="field"><label for="sub-in">Entra (número)</label><input id="sub-in" type="number" inputmode="numeric" min="0" max="99" required /></div>
            </div>
            <div class="row"><button type="submit" class="btn btn-accent">Registrar cambio</button><button type="button" class="btn" onclick="this.closest('dialog').close()">Volver</button></div>
        </form>
    </dialog>

    <dialog id="start-dialog" aria-labelledby="start-title" style="max-width:560px">
        <form onsubmit="submitStart(event)" class="stack" oninput="startDirty = true">
            <h2 id="start-title" class="title" style="font-size:18px"><span id="start-title-text"></span></h2>
            <div id="start-fields" class="stack"></div>
            <p id="start-error" role="alert" class="error"></p>
            <div class="row"><button type="submit" class="btn btn-accent">Empezar set</button><button type="button" class="btn" onclick="skipStart()">Omitir</button></div>
        </form>
    </dialog>

    <dialog id="adjustment-dialog" aria-labelledby="adjustment-title">
        <form onsubmit="submitAdjustment(event)" class="stack">
            <h2 id="adjustment-title" class="title" style="font-size:18px"></h2>
            <p id="adjustment-description" class="small muted"></p>
            <div id="correction-fields" class="stack-sm">
                <div class="form-grid">
                    <div class="field"><label for="correction-home">Puntos local</label><input id="correction-home" type="number" min="0" max="999" required /></div>
                    <div class="field"><label for="correction-away">Puntos visitante</label><input id="correction-away" type="number" min="0" max="999" required /></div>
                </div>
                <div class="field"><label for="correction-status">Resultado del set</label><select id="correction-status"></select></div>
            </div>
            <div class="field"><label for="adjustment-reason">Motivo (queda en el historial)</label><textarea id="adjustment-reason" minlength="3" maxlength="500" required rows="3"></textarea></div>
            <p id="adjustment-error" role="alert" class="error"></p>
            <div class="row"><button id="adjustment-submit" type="submit" class="btn btn-primary">Confirmar y guardar</button><button type="button" class="btn" onclick="this.closest('dialog').close()">Volver</button></div>
        </form>
    </dialog>

    <script>
        const matchId = new URLSearchParams(location.search).get('id')
        const esc = App.escape
        let m = null, history = [], adjustment = null, subSide = null, busy = false, setupDirty = false, setupFor = null
        // Who holds the match. Only the holder sees scoring controls; the server enforces it too.
        let claim = null, heldBefore = null
        const mine = () => claim?.mine === true
        // Device-only preferences: they never reach the server or other screens.
        const stored = key => { try { return localStorage.getItem(key) } catch { return null } }
        const store = (key, value) => { try { localStorage.setItem(key, value) } catch { /* Private mode: keep it in memory. */ } }
        // Left-to-right order of the teams on this screen; the scorer flips it when teams change ends.
        let swapped = stored(`swap-sides-${matchId}`) === '1'
        const order = () => swapped ? ['away', 'home'] : ['home', 'away']
        // Sets the scorer chose to play without a complete toss and lineups.
        const skipped = new Set(JSON.parse(stored('skipped-sets') ?? '[]'))
        let startFor = null, startDirty = false, openStartAfterLoad = false

        const activeSet = () => m.sets.find(s => s.status === 'in_progress') ?? null
        const rawName = side => side === 'home' ? m.teamHome.name : m.teamAway.name
        const teamName = side => esc(rawName(side))
        // What rotation tracking still needs: { firstServeHome, home, away } as sent to /lineup.
        const missing = (setup, name = teamName) => [setup.firstServeHome === null ? 'quién saca primero' : '', ...['home', 'away'].filter(side => !setup[side]).map(side => `la formación de ${name(side)}`)].filter(Boolean)
        const setupOf = set => ({ firstServeHome: set.firstServeHome, home: set.lineups.home ?? null, away: set.lineups.away ?? null })
        const listText = items => items.length > 1 ? `${items.slice(0, -1).join(', ')} y ${items.at(-1)}` : items[0] ?? ''
        // A set is ready to score once it has points, a complete setup, or the scorer skipped the setup.
        const ready = set => set.points.length > 0 || missing(setupOf(set)).length === 0 || skipped.has(set.id)
        // The last undoable entry of the match: the latest point of the most recent set that has points.
        function lastEntry() {
            const set = [...m.sets].sort((a, b) => b.setNumber - a.setNumber).find(s => s.points.length)
            const point = set?.points.at(-1)
            if (!set || !point || point.kind === 'correction' || set.status === 'cancelled') return null
            return { set, point }
        }

        async function load() {
            if (!/^\d+$/.test(matchId ?? '')) throw new Error('Partido no encontrado.')
            const [match, claims] = await Promise.all([App.json(`/api/matches/${matchId}`), App.json('/api/claims')])
            m = match
            claim = claims.find(c => c.matchId === m.id) ?? null
            if (heldBefore && !mine()) App.toast(claim ? `Ahora lo anota ${claim.name}.` : 'El partido quedó libre: ya no lo anotás vos.', true)
            heldBefore = mine()
            render()
            void keepAwake()
            if (openStartAfterLoad) { openStartAfterLoad = false; const active = activeSet(); if (active && !ready(active)) openStart() }
            if (document.getElementById('history').open) await loadHistory()
        }

        // While this device holds a match in play the screen stays on, so the phone does not lock between rallies.
        let wakeLock = null, wakeRequest = null
        async function keepAwake() {
            const want = Boolean(m) && mine() && m.status === 'in_progress' && !document.hidden
            if (want && !wakeLock && !wakeRequest && navigator.wakeLock) {
                wakeRequest = navigator.wakeLock.request('screen')
                    .then(lock => { wakeLock = lock; lock.addEventListener('release', () => { wakeLock = null }); if (!mine()) void lock.release() })
                    .catch(() => { /* Battery saver or no support: the phone locks as usual. */ })
                    .finally(() => { wakeRequest = null })
            } else if (!want && wakeLock) {
                void wakeLock.release().catch(() => {})
                wakeLock = null
            }
        }
        document.addEventListener('visibilitychange', () => { void keepAwake() })

        function court(positions, serving, side) {
            return App.rotationCourt(i => positions[i], { serving, label: `Rotación de ${teamName(side)}`, team: { match: m, side } })
        }
        function toggleSides() {
            swapped = !swapped
            store(`swap-sides-${matchId}`, swapped ? '1' : '0')
            render()
            App.toast(`Ahora ${rawName(order()[0])} está a la izquierda. Sólo cambia en esta pantalla.`)
        }
        const swapButton = () => '<button class="btn btn-sm" onclick="toggleSides()" title="Sólo en esta pantalla">⇄ Invertir lados</button>'

        function render() {
            document.title = `${m.teamHome.name} vs ${m.teamAway.name} · Planilla`
            renderScore()
            const active = activeSet()
            // Do not overwrite a lineup the scorer is typing when another device scores.
            if (!setupDirty || setupFor !== active?.id) renderSetup()
            renderAdmin()
        }

        function renderScore() {
            const active = activeSet()
            const live = m.status === 'in_progress'
            const won = side => App.setsWon(m, side)
            const serving = active?.rotation?.serving
            const winner = App.winner(m)
            const last = lastEntry()
            const header = `<p class="small"><a href="/manager/" class="muted">← Partidos</a></p>
                <div class="spread small muted" style="margin-top:12px"><span>${esc(m.categoryName)} · ${App.court(m.court)} · ${App.date(m.scheduledAt)} ${App.time(m.scheduledAt)}</span>${live ? '<span class="badge badge-live"><span class="live-dot"></span>En juego</span>' : `<span class="badge">${App.statusLabel(m.status)}</span>`}</div>`
            const [left, right] = order()
            const dot = side => serving === side ? '<span class="serve" title="Saca"></span>' : ''
            const scoreline = `<div class="scoreline">
                    <div class="side"><div class="team-name">${teamName(left)}${dot(left)}</div><div class="club">Sets ${won(left)}</div></div>
                    <div>${App.scoreBox(m, active ? { home: active.scoreHome, away: active.scoreAway } : { home: won('home'), away: won('away') }, order())}<div class="under" id="score-under">${active ? `Set ${active.setNumber}` : winner ? `Ganó ${esc(winner.name)}` : App.statusLabel(m.status)}</div></div>
                    <div class="side"><div class="team-name">${dot(right)}${teamName(right)}</div><div class="club">Sets ${won(right)}</div></div>
                </div>`
            let body = ''
            if (m.status === 'upcoming') {
                body = `<div class="stack" style="margin-top:20px"><p class="small muted">${App.rulesText(m.rules)}</p>${!claim || mine() ? '<button class="btn btn-accent btn-point" onclick="act(startMatch)">Iniciar partido</button>' : ''}</div>`
            } else if (live && active && !mine()) {
                body = `${rotationBlock(active, false)}`
            } else if (live && active && !ready(active)) {
                // The set waits for its toss and lineups: one clear step instead of a panel below.
                body = `<div class="stack" style="margin-top:20px">
                        <button class="btn btn-accent btn-point" onclick="openStart()">Iniciar set ${active.setNumber}</button>
                        <div class="spread">${last ? '<button class="btn" onclick="act(undo)">↶ Deshacer último punto</button>' : '<span></span>'}${swapButton()}</div>
                    </div>`
            } else if (live && active) {
                const lacking = missing(setupOf(active))
                body = `<p class="tiny muted" data-tip="rules" data-tip-at="score-under" style="text-align:center;margin-top:10px">${App.rulesText(m.rules)}. El set y el partido se cierran solos al llegar al puntaje.</p>
                    <div class="form-grid" style="margin-top:20px;grid-template-columns:1fr 1fr">
                        ${order().map(side => `<button class="btn btn-primary btn-point" onclick="act(addPoint, ${side === 'home'})">+ ${teamName(side)}</button>`).join('')}
                    </div>
                    <div class="spread" style="margin-top:12px">
                        <button class="btn" onclick="act(undo)" ${last ? '' : 'disabled'}>↶ Deshacer último punto</button>
                        ${swapButton()}
                    </div>
                    ${lacking.length ? `<p class="small" style="margin-top:12px;color:var(--warn)">No se sigue la rotación: falta ${listText(lacking)}. Completalo en «Saque y formación inicial».</p>` : ''}
                    ${rotationBlock(active, true)}
                    <details class="panel" style="margin-top:20px"><summary>Cargar resultado final del set ${active.setNumber}</summary>
                        <p class="tiny muted" style="margin:8px 0">Para cuando no se anota punto a punto. El ganador se calcula con las reglas del partido.</p>
                        <div class="form-grid">${order().map(side => `<div class="field"><label for="final-${side}">${teamName(side)}</label><input id="final-${side}" type="number" inputmode="numeric" min="0" max="999" value="${side === 'home' ? active.scoreHome : active.scoreAway}" /></div>`).join('')}</div>
                        <button class="btn btn-accent" style="margin-top:12px" onclick="act(finishSet)">Guardar resultado del set</button>
                    </details>`
            } else {
                body = `<div class="stack" style="margin-top:20px">
                    <p class="small muted">${m.status === 'cancelled' ? 'Partido cancelado.' : winner ? `Partido terminado. Ganó ${esc(winner.name)}.` : 'Partido detenido.'}</p>
                    ${last && mine() && m.status !== 'cancelled' ? `<button class="btn" onclick="act(undo)">↶ Deshacer último punto (reabre el partido)</button>` : ''}</div>`
            }
            const sets = m.sets.filter(s => s.status !== 'in_progress')
            const setList = sets.length ? `<h2 class="section">Sets</h2>${sets.map(s => `<div class="list-row"><span class="grow">Set ${s.setNumber} · <span class="num">${s.scoreHome}–${s.scoreAway}</span> <span class="muted small">· ${s.status === 'cancelled' ? 'cancelado' : `ganó ${teamName(s.status.slice(9))}`}</span></span>${App.isAdmin() ? `<button class="btn btn-sm" onclick="openAdjustment(${s.id}, 'correct')">Corregir</button>` : ''}</div>`).join('')}` : ''
            document.getElementById('score').innerHTML = header + claimBar() + scoreline + body + setList
        }

        function claimBar() {
            const since = claim ? ` desde las ${App.time(claim.since)}` : ''
            const text = !claim ? 'Nadie está anotando este partido.' : mine() ? `Lo anotás vos${since}.` : `Lo anota <strong>${esc(claim.name)}</strong>${since}. Para anotarlo, pedile que lo libere.`
            const button = !claim ? '<button class="btn btn-sm btn-primary" onclick="act(takeMatch)">Tomar partido</button>'
                : mine() ? '<button class="btn btn-sm" onclick="act(releaseMatch)">Liberar</button>'
                : App.isAdmin() ? '<button class="btn btn-sm btn-danger" onclick="act(forceRelease)">Forzar liberación</button>' : ''
            return `<div id="claim-bar" class="spread small" style="margin-top:12px;gap:8px"><span class="${mine() ? '' : 'muted'}">${text}</span>${button}</div>`
        }

        function rotationBlock(set, editable) {
            const r = set.rotation
            if (!r.positions.home && !r.positions.away) return ''
            const changes = set.substitutions
            const lastChange = changes.at(-1)
            const rallies = set.points.filter(p => p.kind === 'rally').length
            const side = key => r.positions[key] ? `<div><div class="spread" style="margin-bottom:6px"><span class="small">${teamName(key)}${r.serving === key ? ' · saca' : ''}</span>${editable ? `<button class="btn btn-sm" onclick="openSubstitution('${key}')">Cambio</button>` : ''}</div>${court(r.positions[key], r.serving === key, key)}</div>` : ''
            return `<h2 class="section">Rotación</h2><div class="courts">${order().map(side).join('')}</div>
                ${changes.length ? `<p class="tiny muted" style="margin-top:8px">Cambios: ${changes.map(c => `${teamName(c.side)} ${c.playerOut}→${c.playerIn}`).join(' · ')}
                ${editable && lastChange.afterRallies === rallies ? ` <button class="btn-link tiny" onclick="act(undoSubstitution, ${lastChange.id})">deshacer último</button>` : ''}</p>` : ''}`
        }

        // Toss and lineup inputs, shared by the start dialog and the panel below the score.
        function setupFields(set, prefix) {
            // Teams often repeat their lineup: offer the previous set's, saved only when the scorer confirms.
            const previous = [...m.sets].filter(s => s.setNumber < set.setNumber).sort((a, b) => b.setNumber - a.setNumber)
            const lineupInputs = side => {
                const saved = set.lineups[side]
                const current = saved ?? previous.find(s => s.lineups[side])?.lineups[side]
                return `<div><p class="small" style="margin-bottom:6px">${teamName(side)}${!saved && current ? ' <span class="tiny muted">· precargada del set anterior</span>' : ''}</p>${App.rotationCourt(i => `<input class="input num" type="number" inputmode="numeric" min="0" max="99" id="${prefix}-${side}-${i}" aria-label="${teamName(side)} posición ${i + 1}" value="${current ? current[i] : ''}" />`, { team: { match: m, side } })}</div>`
            }
            // Outside the deciding set, the team that received first in the previous set serves first.
            const last = previous[0]
            const suggested = set.firstServeHome === null && last?.firstServeHome != null && set.setNumber < m.rules.bestOf
            const serve = set.firstServeHome ?? (suggested ? !last.firstServeHome : null)
            return `<fieldset class="row"><legend class="small muted" style="margin-bottom:6px">Saca primero${suggested ? ' <span class="tiny">· sugerido: alterna con el set anterior</span>' : ''}</legend>
                    ${order().map(side => `<label class="check"><input type="radio" name="${prefix}-serve" value="${side}" ${serve === (side === 'home') ? 'checked' : ''}> ${teamName(side)}</label>`).join('')}
                </fieldset>
                <p class="small muted" id="${prefix}-lineup-label">Formación inicial</p>
                <p class="small muted" data-tip="lineup-help">Números de camiseta según la planilla. Arriba la red (posiciones 4, 3 y 2), abajo la línea de fondo (5, 6 y 1). La posición 1 saca.</p>
                <div class="courts">${order().map(lineupInputs).join('')}</div>`
        }
        // Reads the inputs of setupFields. Returns { body } for /lineup or { error }.
        function readSetup(prefix) {
            const serve = document.querySelector(`input[name="${prefix}-serve"]:checked`)?.value
            const body = { firstServeHome: serve ? serve === 'home' : null }
            for (const side of ['home', 'away']) {
                const values = [0, 1, 2, 3, 4, 5].map(i => document.getElementById(`${prefix}-${side}-${i}`).value.trim())
                if (values.every(v => v === '')) { body[side] = null; continue }
                if (values.some(v => v === '')) return { error: `Completá las 6 posiciones de ${rawName(side)} o dejalas vacías.` }
                body[side] = values.map(Number)
                if (new Set(body[side]).size !== 6) return { error: `Hay números repetidos en ${rawName(side)}.` }
            }
            return { body }
        }

        // Toss and starting lineup for the set in play, editable at any time once the set started.
        function renderSetup() {
            const active = activeSet()
            setupDirty = false
            setupFor = active?.id ?? null
            if (!active || m.status !== 'in_progress' || !mine() || !ready(active)) { document.getElementById('setup').innerHTML = ''; return }
            const started = active.points.length > 0
            const lacking = missing(setupOf(active))
            const form = `<div class="stack" style="margin-top:12px" oninput="setupDirty = true">
                    ${setupFields(active, 'lineup')}
                    ${started ? '<p class="tiny muted">El set ya empezó: al guardar, la rotación se recalcula con todos los puntos anotados.</p>' : ''}
                    <div class="row"><button class="btn btn-accent" onclick="act(saveLineup)">Guardar formación</button></div>
                </div>`
            document.getElementById('setup').innerHTML = `<details class="panel" style="margin-top:20px" ${lacking.length && !started ? 'open' : ''}><summary>Saque y formación inicial · set ${active.setNumber}${lacking.length ? ` · falta ${listText(lacking)}` : ' ✓'}</summary>${form}</details>`
        }

        // --- Start of a set: toss and both lineups in one step ---
        function openStart() {
            const active = activeSet()
            if (!active || busy || !mine()) return
            startFor = active.id
            startDirty = false
            document.getElementById('start-title-text').textContent = `Iniciar set ${active.setNumber}`
            document.getElementById('start-fields').innerHTML = `<p class="small muted" data-tip="set-start" data-tip-at="start-title">Para seguir la rotación hacen falta las dos formaciones y quién saca primero. Si todavía no las tenés, tocá «Omitir» y completalas después.</p>${setupFields(active, 'start')}`
            document.getElementById('start-error').textContent = ''
            document.getElementById('start-dialog').showModal()
        }
        function startedSet() {
            const active = activeSet()
            if (active?.id === startFor) return active
            document.getElementById('start-dialog').close()
            App.toast('El set cambió en otra pantalla. Revisá el marcador.', true)
            return null
        }
        function submitStart(event) {
            event.preventDefault()
            const active = startedSet()
            if (!active || busy) return
            const { body, error } = readSetup('start')
            const lacking = body ? missing(body, rawName) : []
            const message = error ?? (lacking.length ? `Falta ${listText(lacking)}. Completalo o tocá «Omitir».` : '')
            if (message) { document.getElementById('start-error').textContent = message; return }
            act(async () => {
                const res = await App.send(`/api/sets/${active.id}/lineup`, 'PUT', body)
                if (!res.ok) return
                document.getElementById('start-dialog').close()
                App.toast(`Set ${active.setNumber} en juego. La rotación se sigue punto a punto.`)
            })
        }
        function skipStart() {
            const active = startedSet()
            if (!active || busy) return
            if (!confirm('Si no cargás las dos formaciones y quién saca primero, no vamos a poder seguir la rotación.\n\nPodés completarlo después en «Saque y formación inicial». ¿Empezar el set igual?')) return
            const { body } = readSetup('start')
            skipped.add(active.id)
            store('skipped-sets', JSON.stringify([...skipped].slice(-50)))
            document.getElementById('start-dialog').close()
            // Keep what the scorer typed if it is valid; an untouched prefill is not saved.
            const typed = startDirty && body && (body.firstServeHome !== null || body.home || body.away)
            if (typed) act(async () => { await App.send(`/api/sets/${active.id}/lineup`, 'PUT', body) })
            else render()
            App.toast(`Set ${active.setNumber} sin rotación. Podés completarla abajo, en «Saque y formación inicial».`, true)
        }

        function renderAdmin() {
            if (!App.isAdmin()) { document.getElementById('admin').innerHTML = ''; return }
            if (document.querySelector('#admin :focus')) return
            const active = activeSet()
            const latest = m.sets.at(-1)
            const statuses = [['upcoming', 'Próximo'], ['in_progress', 'En juego'], ['finished_home', `Ganó ${teamName('home')}`], ['finished_away', `Ganó ${teamName('away')}`], ['cancelled', 'Cancelado']]
            document.getElementById('admin').innerHTML = `<h2 class="section">Organización</h2>
                <p class="small muted" data-tip="admin-rulings" style="margin-bottom:12px">Decisiones administrativas: quedan en el historial con su motivo. Usalas para walkover, abandono o errores de planilla.</p>
                <div class="stack">
                    <p class="small"><a class="btn-link" href="/manager/match-form.html?id=${m.id}">Editar horario, cancha o reglas</a></p>
                    <div><p class="small" style="margin-bottom:6px">Estado oficial del partido</p><div class="row">${statuses.map(([value, label]) => `<button class="btn btn-sm" ${m.status === value ? 'aria-pressed="true" style="border-color:var(--ink);font-weight:600"' : ''} onclick="act(updateMatchStatus, '${value}')">${label}</button>`).join('')}</div></div>
                    ${active && m.status === 'in_progress' ? `<div><button class="btn btn-sm btn-danger" onclick="act(cancelSet)">Cancelar set ${active.setNumber}</button></div>` : ''}
                    ${m.status !== 'in_progress' && latest?.status === 'cancelled' && latest.points.length ? `<div class="panel small"><p>¿Se cerró el partido por error? El último set conserva ${latest.scoreHome}–${latest.scoreAway}.</p><button class="btn btn-sm" style="margin-top:8px" onclick="openAdjustment(${latest.id}, 'recover')">Recuperar último set</button></div>` : ''}
                </div>`
        }

        // The history panel stays outside the re-rendered sections so opening it is stable.
        function renderHistory() {
            const labels = { claim: 'Tomó el partido', release: 'Liberó el partido', release_forced: 'Liberación forzada', set_correction: 'Corrección de set', set_recovery: 'Recuperación de set', match_close: 'Cierre con set activo', match_status: 'Estado del partido', set_cancel: 'Set cancelado', set_lineup: 'Saque y formación' }
            document.getElementById('history-list').innerHTML = history.map(e => `<div class="list-row small"><div class="grow"><strong>${esc(labels[e.action] ?? e.action)}</strong>${e.setId ? ` · set ${m.sets.find(s => s.id === e.setId)?.setNumber ?? '—'}` : ''}<br><span class="muted">${esc(e.reason)}${auditState(e.before) || auditState(e.after) ? ' · ' : ''}${esc(auditState(e.before))}${auditState(e.before) && auditState(e.after) ? ' → ' : ''}${esc(auditState(e.after))}</span></div><span class="tiny muted">${esc(e.actor)} · ${App.date(e.createdAt)} ${App.time(e.createdAt)}</span></div>`).join('') || '<p class="small muted">Sin decisiones registradas.</p>'
        }
        async function loadHistory() { history = await App.json(`/api/matches/${matchId}/history`); renderHistory() }
        function auditState(value) {
            const labels = { upcoming: 'Próximo', in_progress: 'En juego', finished_home: 'Ganó local', finished_away: 'Ganó visitante', cancelled: 'Cancelado' }
            return [value.holder ? `Planillero: ${value.holder}` : '', value.matchStatus ? `Partido: ${labels[value.matchStatus]}` : '', value.status ? `Set: ${labels[value.status]}` : '', value.scoreHome !== undefined ? `${value.scoreHome}–${value.scoreAway}` : ''].filter(Boolean).join(' · ')
        }

        // --- Actions (one at a time; every result comes from the server) ---
        async function act(fn, ...args) {
            if (busy) return
            busy = true
            const paused = [...document.querySelectorAll('main button:not(:disabled)')]
            paused.forEach(b => { b.disabled = true })
            try { await fn(...args) }
            catch { App.toast('No pudimos guardar el cambio. Revisá el marcador antes de reintentar.', true) }
            finally {
                busy = false
                await load().catch(() => {})
                // Sections kept on screen (e.g. a lineup being typed) get their buttons back.
                paused.forEach(b => { b.disabled = false })
            }
        }
        async function takeMatch() {
            const res = await App.send(`/api/claims/${m.id}`, 'POST', {})
            if (res.ok) App.toast('Tomaste el partido. Liberalo cuando dejes de anotar.')
        }
        async function releaseMatch() {
            if (!confirm('¿Liberar el partido? Otra persona podrá tomarlo y vos dejarás de anotarlo.')) return
            const res = await App.send(`/api/claims/${m.id}/release`, 'POST', {})
            if (res.ok) { heldBefore = false; App.toast('Partido liberado.') }
        }
        async function forceRelease() {
            if (!confirm(`¿Quitarle el partido a ${claim.name}? Usalo si se fue o perdió el teléfono: deja de poder anotar y cualquiera puede tomarlo. Queda en el historial.`)) return
            const res = await App.send(`/api/claims/${m.id}/release`, 'POST', { expectedHolder: claim.name })
            if (res.ok) App.toast('Partido liberado. Ya lo puede tomar otra persona.')
        }
        async function startMatch() {
            const res = await App.send(`/api/matches/${m.id}`, 'PUT', { status: 'in_progress', expectedStatus: 'upcoming' })
            if (res.ok) { App.toast('Partido iniciado.'); openStartAfterLoad = true }
        }
        function announce(result) {
            if (result.matchWinner) App.toast(`Partido terminado. Ganó ${result.matchWinner === 'home' ? m.teamHome.name : m.teamAway.name}.`)
            else if (result.setWinner) App.toast(`Set para ${result.setWinner === 'home' ? m.teamHome.name : m.teamAway.name}. Empieza el set siguiente.`)
        }
        async function addPoint(homeScored) {
            const active = activeSet()
            if (!active) return
            // The last point this screen saw: a stale tap or a retried request is rejected, not counted twice.
            const expectedLastPointId = active.points.at(-1)?.id ?? null
            let res
            try { res = await App.send('/api/points', 'POST', { setId: active.id, homeScored, expectedLastPointId }) }
            catch (error) {
                // The answer was lost, but the point may have been saved. Say which before the scorer taps again.
                const fresh = await App.json(`/api/matches/${matchId}`).catch(() => null)
                if (!fresh) throw error // Still offline: the screen stays stale, so a retry is rejected if it was saved.
                const set = fresh.sets.find(s => s.id === active.id)
                if ((set?.points.at(-1)?.id ?? null) === expectedLastPointId) App.toast('Se cortó la conexión y el punto no se anotó. Tocá de nuevo.', true)
                else App.toast(`Se cortó la conexión, pero el punto quedó anotado${set?.status === 'in_progress' ? ` (${set.scoreHome}–${set.scoreAway})` : ''}. No lo anotes de nuevo.`)
                return
            }
            if (!res.ok) return
            navigator.vibrate?.(15) // A short buzz confirms the point was saved without looking away from the court.
            announce(await res.json())
        }
        async function undo() {
            const last = lastEntry()
            if (!last) return
            const closed = last.set.status !== 'in_progress'
            if (closed && !confirm(`El último punto cerró el set ${last.set.setNumber}${m.status !== 'in_progress' ? ' y el partido' : ''}. ¿Deshacerlo y reabrir${m.status !== 'in_progress' ? 'los' : 'lo'}?${m.status === 'in_progress' ? ' Se descarta la formación cargada para el set siguiente.' : ''}`)) return
            const res = await App.send(`/api/points/${last.point.id}`, 'DELETE')
            if (res.ok && closed) App.toast('Punto deshecho. El set volvió a estar en juego.')
        }
        async function finishSet() {
            const active = activeSet()
            const scoreHome = Number(document.getElementById('final-home').value), scoreAway = Number(document.getElementById('final-away').value)
            if (!confirm(`¿Cerrar el set ${active.setNumber} con ${scoreHome}–${scoreAway}?`)) return
            const res = await App.send(`/api/sets/${active.id}/finish`, 'POST', { scoreHome, scoreAway, expectedLastPointId: active.points.at(-1)?.id ?? null })
            if (res.ok) announce(await res.json())
        }
        async function saveLineup() {
            const active = activeSet()
            const { body, error } = readSetup('lineup')
            if (error) return App.toast(error, true)
            const res = await App.send(`/api/sets/${active.id}/lineup`, 'PUT', body)
            if (res.ok) { setupDirty = false; App.toast(missing(body).length ? 'Formación guardada. Falta completar para seguir la rotación.' : 'Formación guardada.') }
        }
        function openSubstitution(side) {
            const active = activeSet()
            if (!active || busy) return
            subSide = side
            document.getElementById('sub-title-text').textContent = `Cambio · ${side === 'home' ? m.teamHome.name : m.teamAway.name}`
            document.getElementById('sub-out').innerHTML = active.rotation.positions[side].map((n, i) => `<option value="${n}">${n} (posición ${i + 1})</option>`).join('')
            document.getElementById('sub-in').value = ''
            document.getElementById('sub-dialog').showModal()
        }
        function submitSubstitution(event) {
            event.preventDefault()
            const active = activeSet()
            const body = { side: subSide, playerOut: Number(document.getElementById('sub-out').value), playerIn: Number(document.getElementById('sub-in').value) }
            document.getElementById('sub-dialog').close()
            act(async () => { const res = await App.send(`/api/sets/${active.id}/substitutions`, 'POST', body); if (res.ok) App.toast(`Cambio: entra ${body.playerIn} por ${body.playerOut}.`) })
        }
        async function undoSubstitution(id) { await App.send(`/api/sets/${activeSet().id}/substitutions/${id}`, 'DELETE') }

        // --- Admin rulings ---
        async function cancelSet() {
            const active = activeSet()
            if (!confirm(`¿Cancelar el set ${active.setNumber} (${active.scoreHome}–${active.scoreAway})? No cuenta como ganado y empieza otro desde 0–0.`)) return
            await App.send(`/api/sets/${active.id}`, 'PUT', { status: 'cancelled', expectedLastPointId: active.points.at(-1)?.id ?? null })
        }
        async function updateMatchStatus(status) {
            if (status === m.status) return
            const active = activeSet()
            const closing = !['in_progress', 'upcoming'].includes(status)
            if (closing && !confirm(`¿Registrar "${{ finished_home: `Ganó ${m.teamHome.name}`, finished_away: `Ganó ${m.teamAway.name}`, cancelled: 'Cancelado' }[status]}" como resultado oficial?${active?.points.length ? `\n\nEl set ${active.setNumber} (${active.scoreHome}–${active.scoreAway}) quedará cancelado; sus puntos se conservan para poder recuperarlo.` : ''}`)) return
            const latest = m.sets.at(-1)
            const startNewSet = status === 'in_progress' && !active && latest?.status === 'cancelled' && latest.points.length > 0
            if (startNewSet && !confirm('El último set cancelado conserva puntos. Podés recuperarlo con "Recuperar último set". ¿Preferís iniciar un set NUEVO desde 0–0?')) return
            await App.send(`/api/matches/${m.id}`, 'PUT', { status, expectedStatus: m.status, ...(closing ? { expectedActiveSet: active ? { id: active.id, lastPointId: active.points.at(-1)?.id ?? null } : null } : {}), ...(startNewSet ? { startNewSet: true } : {}) })
        }
        function openAdjustment(id, mode) {
            const set = m.sets.find(s => s.id === id)
            if (!set || busy) return
            adjustment = { set: structuredClone(set), mode, matchStatus: m.status }
            document.getElementById('adjustment-title').textContent = `${mode === 'recover' ? 'Recuperar' : 'Corregir'} set ${set.setNumber}`
            document.getElementById('adjustment-description').textContent = mode === 'recover'
                ? `Se retoma el marcador ${set.scoreHome}–${set.scoreAway} y el partido vuelve a estar en juego.`
                : 'Resultado administrativo del set. Se conserva el historial anterior; el resultado oficial del partido no cambia solo: ajustalo aparte si corresponde.'
            document.getElementById('correction-fields').hidden = mode === 'recover'
            document.getElementById('correction-home').value = set.scoreHome
            document.getElementById('correction-away').value = set.scoreAway
            document.getElementById('correction-status').innerHTML = [['finished_home', `Ganó ${m.teamHome.name}`], ['finished_away', `Ganó ${m.teamAway.name}`], ['cancelled', 'Cancelado']].map(([value, label]) => `<option value="${value}">${esc(label)}</option>`).join('')
            document.getElementById('correction-status').value = set.status
            document.getElementById('adjustment-reason').value = ''
            document.getElementById('adjustment-error').textContent = ''
            document.getElementById('adjustment-dialog').showModal()
        }
        async function submitAdjustment(event) {
            event.preventDefault()
            if (!adjustment || busy) return
            const { set, mode, matchStatus } = adjustment
            const reason = document.getElementById('adjustment-reason').value.trim()
            if (reason.length < 3) { document.getElementById('adjustment-error').textContent = 'Escribí un motivo de al menos 3 caracteres.'; return }
            busy = true
            document.getElementById('adjustment-submit').disabled = true
            try {
                const response = await App.send(`/api/sets/${set.id}/${mode}`, 'POST', { expectedStatus: set.status, expectedRevision: set.revision, expectedLastPointId: set.points.at(-1)?.id ?? null, reason,
                    ...(mode === 'recover' ? { expectedMatchStatus: matchStatus } : { scoreHome: Number(document.getElementById('correction-home').value), scoreAway: Number(document.getElementById('correction-away').value), status: document.getElementById('correction-status').value }) })
                if (!response.ok) {
                    document.getElementById('adjustment-error').textContent = (await response.json()).error
                    if (response.status === 409) { document.getElementById('adjustment-dialog').close(); await load() }
                    return
                }
                document.getElementById('adjustment-dialog').close()
                App.toast(mode === 'recover' ? 'Set recuperado. El partido está en juego.' : 'Corrección registrada con su motivo.')
                await load()
            } finally { busy = false; document.getElementById('adjustment-submit').disabled = false }
        }

        App.ready.then(load).catch(() => {
            document.getElementById('score').innerHTML = '<p class="empty">No pudimos cargar el partido. <a href="/manager/">Volver</a></p>'
        }).finally(() => { if (/^\d+$/.test(matchId ?? '')) App.watch(() => busy ? Promise.resolve() : load()) })
    </script>
</body>
</html>
