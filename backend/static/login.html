<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingresar · Torneo de vóley</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js"></script>
</head>
<body>
    <header class="bar"></header>
    <main class="login">
        <h1 class="title">Ingresar</h1>
        <p class="small muted" style="margin:4px 0 20px">Para planilleros y organización, con la cuenta de Google que cargó la organización. El público no necesita cuenta.</p>
        <div class="stack">
            <p id="error-msg" class="error hidden" role="alert"></p>
            <a href="/api/auth/google" class="btn btn-primary" style="width:100%">Ingresar con Google</a>
            <form id="dev-login" class="stack-sm hidden" onsubmit="devLogin(event)">
                <p class="tiny muted">Prueba local (DEV_LOGIN): entrar como un usuario cargado en Usuarios.</p>
                <div class="field"><label for="dev-email">Email</label><input id="dev-email" type="email" autocapitalize="none" required /></div>
                <button type="submit" class="btn" style="width:100%">Entrar sin Google</button>
            </form>
        </div>
    </main>
    <script>
        const messages = {
            'no-member': 'No sos parte de la organización. Pedile al administrador que agregue tu email.',
            unavailable: 'El ingreso con Google todavía no está configurado.',
            failed: 'No se pudo completar el ingreso con Google. Intentá otra vez.',
        }
        App.ready.then(() => document.getElementById('dev-login').classList.toggle('hidden', !App.config.devLogin))
        async function devLogin(event) {
            event.preventDefault()
            const res = await App.send('/api/auth/dev-login', 'POST', { email: document.getElementById('dev-email').value })
            if (res.ok) location.assign('/manager/')
        }
        const code = new URLSearchParams(location.search).get('error')
        if (messages[code]) {
            const error = document.getElementById('error-msg')
            error.textContent = messages[code]
            error.classList.remove('hidden')
            history.replaceState(null, '', location.pathname)
        }
    </script>
</body>
</html>
