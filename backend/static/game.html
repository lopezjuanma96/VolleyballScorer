<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18211c" />
    <title>Partido · En vivo</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js"></script>
</head>
<body>
    <header class="site-header"><a class="wordmark" href="/"><span class="brand-icon" aria-hidden="true">←</span><span data-tournament-name>Torneo de vóley</span></a><span class="connection" data-connection role="status">Conectando…</span></header>
    <main class="px-4 py-8 max-w-2xl mx-auto space-y-5" id="content"><div class="empty-state">Cargando partido…</div></main>
    <script>
        const matchId = new URLSearchParams(location.search).get('id')
        let currentMatch, activeSetId = null
        const esc = App.escape
        function render() {
            const m = currentMatch
            const live = m.status === 'in_progress'
            const active = live && m.sets.find(s => s.status === 'in_progress')
            const selected = m.sets.find(s => s.id === activeSetId) ?? m.sets.at(-1)
            const won = side => m.sets.filter(s => s.status === `finished_${side}`).length
            const status = { upcoming: 'Próximo partido', in_progress: '● En juego', finished_home: 'Finalizado', finished_away: 'Finalizado', cancelled: 'Cancelado' }[m.status]
            document.title = `${m.teamHome.name} vs ${m.teamAway.name} · Vóley`
            document.getElementById('content').innerHTML = `
                <section class="score-panel">
                    <div class="match-meta"><span>${esc(m.categoryName)} · ${App.court(m.court)}</span><span class="match-badge">${status}</span></div>
                    <div class="score-pair"><div class="score-team">${esc(m.teamHome.name)}<small>LOCAL · ${esc(m.teamHome.clubName)}</small></div><div class="score-number">${active ? `${active.scoreHome} : ${active.scoreAway}` : `${won('home')} : ${won('away')}`}</div><div class="score-team">${esc(m.teamAway.name)}<small>VISITANTE · ${esc(m.teamAway.clubName)}</small></div></div>
                    <div class="match-bottom"><span>${active ? `Set ${active.setNumber} · Sets ${won('home')}–${won('away')}` : 'Sets ganados'}</span><span>${App.date(m.scheduledAt)} · ${App.time(m.scheduledAt)}</span></div>
                </section>
                <section class="bg-white rounded-xl shadow p-4 overflow-x-auto"><h2 class="section-label">El partido, set a set</h2><table class="score-table"><thead><tr><th>Equipo</th>${m.sets.map(s => `<th>Set ${s.setNumber}${s.status === 'cancelled' ? ' ✕' : ''}</th>`).join('')}<th>Sets</th></tr></thead><tbody>${['home', 'away'].map(side => `<tr><td>${esc(side === 'home' ? m.teamHome.name : m.teamAway.name)}</td>${m.sets.map(s => `<td>${s.status === 'cancelled' ? '–' : side === 'home' ? s.scoreHome : s.scoreAway}</td>`).join('')}<td><strong>${won(side)}</strong></td></tr>`).join('')}</tbody></table></section>
                <section class="bg-white rounded-xl shadow p-4"><h2 class="section-label">Punto a punto</h2><nav class="category-tabs" aria-label="Elegir set">${m.sets.map(s => `<button class="filter-pill ${selected?.id === s.id ? 'active' : ''}" onclick="selectSet(${s.id})" aria-pressed="${selected?.id === s.id}">Set ${s.setNumber}${s.status === 'cancelled' ? ' ✕' : ''}</button>`).join('')}</nav>${selected?.points.length ? `<div class="max-h-80 overflow-y-auto"><table class="score-table"><caption class="sr-only">Historial del set ${selected.setNumber}</caption><thead><tr><th>Registro</th><th>${esc(m.teamHome.name)}</th><th>${esc(m.teamAway.name)}</th></tr></thead><tbody>${selected.points.map((p, i) => `<tr><td>${i + 1}</td><td>${p.homeScored ? `<strong>${p.scoreHome}</strong>` : p.scoreHome}</td><td>${!p.homeScored ? `<strong>${p.scoreAway}</strong>` : p.scoreAway}</td></tr>`).join('')}</tbody></table></div>` : '<p class="text-sm text-gray-500 py-6 text-center">Todavía no hay puntos en este set.</p>'}</section>
                <a href="/" class="block text-sm text-gray-500 text-center py-4">← Todos los partidos</a>`
        }
        function selectSet(id) { activeSetId = id; render() }
        async function load() {
            if (!/^\d+$/.test(matchId ?? '')) throw new Error('Partido no encontrado.')
            currentMatch = await App.json(`/api/matches/${matchId}`)
            render()
        }
        App.ready.then(load).catch(() => {
            document.getElementById('content').innerHTML = '<div class="empty-state"><strong>No pudimos cargar este partido.</strong><a href="/">Volver al fixture ↗</a></div>'
        }).finally(() => { if (/^\d+$/.test(matchId ?? '')) App.watch(load) })
    </script>
</body>
</html>
