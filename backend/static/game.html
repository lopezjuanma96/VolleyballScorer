<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Partido · Torneo de vóley</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js"></script>
</head>
<body>
    <header class="bar"></header>
    <main class="page page-narrow" id="content"><p class="empty">Cargando partido…</p></main>
    <script>
        const matchId = new URLSearchParams(location.search).get('id')
        let currentMatch, activeSetId = null
        const esc = App.escape
        // Front row IV III II, back row V VI I; positions[0] is I, the server.
        function court(positions, serving) {
            const cell = index => `<div class="${serving && index === 0 ? 'server' : ''}">${positions[index]}<small>${['I', 'II', 'III', 'IV', 'V', 'VI'][index]}</small></div>`
            return `<div class="court">${[3, 2, 1, 4, 5, 0].map(cell).join('')}</div>`
        }
        function rotation(m, set) {
            const r = set?.rotation
            if (!r || (!r.positions.home && !r.positions.away)) return ''
            const side = key => r.positions[key] ? `<div><p class="small" style="margin-bottom:6px">${esc(key === 'home' ? m.teamHome.name : m.teamAway.name)}${r.serving === key ? ' · saca' : ''}</p>${court(r.positions[key], r.serving === key)}</div>` : ''
            return `<h2 class="section">Rotación · set ${set.setNumber}</h2><div class="courts">${side('home')}${side('away')}</div>`
        }
        function render() {
            const m = currentMatch
            const live = m.status === 'in_progress'
            const winner = App.winner(m)
            const active = live && m.sets.find(s => s.status === 'in_progress')
            const counted = m.sets.filter(s => s.status === 'finished_home' || s.status === 'finished_away')
            const selected = m.sets.find(s => s.id === activeSetId) ?? active ?? counted.at(-1) ?? m.sets.at(-1)
            const serve = side => active?.rotation?.serving === side ? '<span class="serve" title="Saca"></span>' : ''
            const big = active ? `${active.scoreHome}–${active.scoreAway}` : m.status === 'upcoming' ? App.time(m.scheduledAt) : `${App.setsWon(m, 'home')}–${App.setsWon(m, 'away')}`
            const under = active ? `Set ${active.setNumber} · sets ${App.setsWon(m, 'home')}–${App.setsWon(m, 'away')}` : m.status === 'upcoming' ? App.day(m.scheduledAt) : winner ? `Ganó ${esc(winner.name)}` : App.statusLabel(m.status)
            const status = live ? '<span class="badge badge-live"><span class="live-dot"></span>En juego</span>' : `<span class="badge">${App.statusLabel(m.status)}</span>`
            document.title = `${m.teamHome.name} vs ${m.teamAway.name}`
            document.getElementById('content').innerHTML = `
                <p class="small"><a href="/" class="muted">← Partidos</a></p>
                <div class="spread small muted" style="margin-top:16px"><span>${esc(m.categoryName)} · ${App.court(m.court)} · ${App.date(m.scheduledAt)} ${App.time(m.scheduledAt)}</span>${status}</div>
                <div class="scoreline">
                    <div class="side"><div class="team-name">${esc(m.teamHome.name)}${serve('home')}</div><div class="club">${esc(m.teamHome.clubName)}</div></div>
                    <div><div class="big">${big}</div><div class="under">${under}</div></div>
                    <div class="side"><div class="team-name">${serve('away')}${esc(m.teamAway.name)}</div><div class="club">${esc(m.teamAway.clubName)}</div></div>
                </div>
                ${counted.length || active ? `<div class="table-wrap"><table class="table"><thead><tr><th class="left">Equipo</th>${m.sets.filter(s => s.status !== 'cancelled').map(s => `<th>${s.setNumber}</th>`).join('')}<th>Sets</th></tr></thead><tbody>
                    ${['home', 'away'].map(side => `<tr><td class="left">${esc(side === 'home' ? m.teamHome.name : m.teamAway.name)}</td>${m.sets.filter(s => s.status !== 'cancelled').map(s => `<td ${s.status === `finished_${side}` ? 'style="font-weight:650"' : ''}>${side === 'home' ? s.scoreHome : s.scoreAway}</td>`).join('')}<td class="pts">${App.setsWon(m, side)}</td></tr>`).join('')}
                </tbody></table></div>` : ''}
                ${rotation(m, active || null)}
                ${m.sets.some(s => s.points.length) ? `<h2 class="section">Punto a punto</h2>
                    <nav class="tabs" aria-label="Elegir set">${m.sets.filter(s => s.points.length).map(s => `<button class="tab" onclick="selectSet(${s.id})" aria-pressed="${selected?.id === s.id}">Set ${s.setNumber}${s.status === 'cancelled' ? ' (cancelado)' : ''}</button>`).join('')}</nav>
                    <div class="rally-strip" style="margin-top:12px" aria-label="Marcador después de cada punto">${(selected?.points ?? []).map(p => `<span class="${p.homeScored ? 'home' : ''}" title="${p.homeScored ? esc(m.teamHome.name) : esc(m.teamAway.name)}">${p.scoreHome}-${p.scoreAway}</span>`).join('')}</div>
                    <p class="tiny muted" style="margin-top:8px">Oscuro: punto de ${esc(m.teamHome.name)}. Claro: punto de ${esc(m.teamAway.name)}.</p>` : ''}
                <p class="tiny muted" style="margin-top:32px">${App.rulesText(m.rules ?? { bestOf: 3, setPoints: 25, tiebreakPoints: 15, minLead: 2, pointCap: null })}</p>`
        }
        function selectSet(id) { activeSetId = id; render() }
        async function load() {
            if (!/^\d+$/.test(matchId ?? '')) throw new Error('Partido no encontrado.')
            currentMatch = await App.json(`/api/matches/${matchId}`)
            render()
        }
        App.ready.then(load).catch(() => {
            document.getElementById('content').innerHTML = '<p class="empty">No pudimos cargar este partido. <a href="/">Volver a partidos</a></p>'
        }).finally(() => { if (/^\d+$/.test(matchId ?? '')) App.watch(load) })
    </script>
</body>
</html>
