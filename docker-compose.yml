name: volleyball-scorer
services:
  app:
    build: ./backend
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      PSQL_HOST: db
      PSQL_PORT: 5432
      PORT: 3000
      UPLOAD_DIR: /app/static/uploads
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, bun, -e, "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  db:
    # Pin major version and data layout; never upgrade an existing PG volume in place.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PSQL_DATABASE:-scorer}
      POSTGRES_USER: ${PSQL_USER:-scorer}
      POSTGRES_PASSWORD: ${PSQL_PASSWORD:?Run bun scripts/setup.ts first}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging
  ngrok:
    profiles: [onprem]
    image: ngrok/ngrok:3-alpine
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: [http, 'http://app:3000', '--log=stdout', '--config=/etc/ngrok.yml', '--url=${PUBLIC_URL:-http://localhost:3000}']
    volumes:
      - ./deploy/ngrok.yml:/etc/ngrok.yml:ro
    ports:
      - '127.0.0.1:4040:4040'
    depends_on:
      app:
        condition: service_healthy
    logging: *logging
  caddy:
    profiles: [cloud]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *logging
volumes:
  postgres:
  uploads:
  caddy_data:
  caddy_config:
