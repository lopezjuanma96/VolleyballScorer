# Set the Railway service root directory to backend/ and config path to
# /deploy/railway.toml. Railway runs app + PostgreSQL; Caddy/ngrok are unnecessary.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
